# Full demo stack on one compose network: the gRParse parser, the lol-html
# and libreoffice collectors, the pdf inspector as gRParse's PDF routing
# oracle, their web UIs, and the demo shell that ties them together. The
# calamine server and viewer ride along under the `calamine` profile,
# decoupled from the shell by default.
#
# Profiles beyond the default core:
#   parsers  - the remaining parser services and their viewer UIs: epub,
#              xml, markup, ebcdic, email (proxied tabs), plus poic and
#              fastwarc (native shell tabs, no UI container of their own).
#   heavy    - asr (CPU whisper image; mount ggml weights into ./models of
#              grpc-asr or point ASR models elsewhere), enrich, and
#              vlm-convert (both need an external VLM endpoint via
#              ENRICH_VLM_URL / VLM_ENDPOINT to do real work; their tabs
#              show an amber "no VLM endpoint" state otherwise).
#   calamine - existing opt-in, unchanged.
#
#   docker compose -f compose.stack.yaml up --build
#   docker compose -f compose.stack.yaml --profile parsers up --build
#   docker compose -f compose.stack.yaml --profile parsers --profile heavy --profile calamine up --build
#
# Unlike compose.yaml nothing here touches the host: services reach each
# other by compose service name, and only the nginx proxy publishes a port
# (http://localhost:8080, TLS variant documented in compose/README.md).
# To publish the gRPC ports as well, layer the overlay:
#   docker compose -f compose.stack.yaml -f compose.stack.expose-grpc.yaml up --build
# On a host without an NVIDIA GPU (macOS included), layer the CPU overlay,
# which drops the GPU reservation and runs gRParse on the CPU provider:
#   docker compose -f compose.stack.yaml -f compose.stack.cpu.yaml up
# Fresh machine? compose/clone-siblings.sh fetches the sibling checkouts
# the shell's proto bind mounts below expect.
# The project name differs from compose.yaml's, so both files can be up at
# once without colliding.
#
# Every build carries a pipestreamai/<service> image tag so pushing the whole
# stack later is just `docker compose -f compose.stack.yaml push`.
name: parse-stack

services:
  grparse:
    image: pipestreamai/grparse:latest
    build: .
    expose:
      - "50051"
      - "9464"   # Prometheus /metrics
    volumes:
      - ./models:/models:ro
    environment:
      CUDA_CACHE_DISABLE: "1"
      GRPARSE_METRICS_PORT: "9464"
      GRPARSE_PAGE_IMAGES: "on"   # page previews for the demo's box overlay
      # Collectors by service name on this network; the shell gives them tabs.
      # Targets pointing into the `parsers`/`heavy` profiles are wired even
      # though those services may be down: an unreachable collector fails a
      # matching upload loudly (UNAVAILABLE), where an unconfigured one fails
      # it just as loudly (FAILED_PRECONDITION) - but with the profile up the
      # routing works with no config change. GRPARSE_FASTWARC_TARGET is
      # deliberately absent: the vendored chatnoir fastwarc.v1 dialect the
      # collector client speaks is not wire-compatible with the fastwarc
      # service in this stack (same proto package, different field numbers).
      GRPARSE_LOL_HTML_TARGET: "lol-html:50057"
      GRPARSE_LIBREOFFICE_TARGET: "libreoffice:50053"
      GRPARSE_MARKUP_TARGET: "markup:50065"
      GRPARSE_EPUB_TARGET: "epub:50064"
      GRPARSE_XML_TARGET: "xml:50066"
      GRPARSE_EBCDIC_TARGET: "ebcdic:50063"
      GRPARSE_EMAIL_TARGET: "email:50054"
      GRPARSE_ASR_TARGET: "asr:50055"
      # The PDF routing oracle: text-based PDFs take the inspector's fast
      # path and the in-process CV/ONNX pipeline is skipped; scanned pages
      # fall through with OCR restricted to the pages the inspector names.
      GRPARSE_PDF_TARGET: "pdf-inspector:50067"
      # Raster charts: pictures the classifier calls a chart go to the enrich
      # service for a table (opt-in; unset turns the call off). The endpoint
      # is named per request because the enrich default (ENRICH_VLM_URL,
      # Qwen on :8085) answered 0 of 12 chart images through enrich while
      # North on :8086 answered 12 of 12 (eval/chart_derender/README.md).
      GRPARSE_ENRICH_TARGET: "enrich:50056"
      GRPARSE_ENRICH_TIMEOUT_MS: "5000"
      GRPARSE_ENRICH_VLM_ENDPOINT: "${GRPARSE_ENRICH_VLM_ENDPOINT:-http://krick-1.taild24b1c.ts.net:8086}"
    gpus: all
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  lol-html:
    image: pipestreamai/grpc-lol-html:latest
    build: ../grpc-lol-html
    expose:
      - "50057"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  libreoffice:
    image: pipestreamai/grpc-libreoffice:latest
    build: ../grpc-libreoffice
    expose:
      - "50053"
    # The server insists on a tmpfs at /tmp (uploads stay in RAM) and refuses
    # to boot without one; see grpc-libreoffice/Dockerfile.
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  calamine:
    profiles: ["calamine"]
    image: pipestreamai/grpc-calamine:latest
    build: ../grpc-calamine
    expose:
      - "50062"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  pdf-inspector:
    image: pipestreamai/grpc-pdf-inspector:latest
    build: ../grpc-pdf-inspector
    expose:
      - "50067"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  epub:
    profiles: ["parsers"]
    image: pipestreamai/grpc-epub:latest
    build: ../grpc-epub
    expose:
      - "50064"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  xml:
    profiles: ["parsers"]
    image: pipestreamai/grpc-xml:latest
    build: ../grpc-xml
    expose:
      - "50066"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  markup:
    profiles: ["parsers"]
    image: pipestreamai/grpc-markup:latest
    build: ../grpc-markup
    expose:
      - "50065"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ebcdic:
    profiles: ["parsers"]
    image: pipestreamai/grpc-ebcdic:latest
    build: ../grpc-ebcdic
    expose:
      - "50063"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  email:
    profiles: ["parsers"]
    image: pipestreamai/grpc-email:latest
    build: ../grpc-email
    expose:
      - "50054"
    read_only: true
    tmpfs:
      - /tmp:size=64m   # JVM scratch (hsperfdata, temp attachments)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  poic:
    profiles: ["parsers"]
    image: pipestreamai/grpoic:latest
    build: ../grPOIc
    expose:
      - "50052"
    read_only: true
    tmpfs:
      - /tmp:size=64m   # JVM scratch; POI spools large office files here
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  fastwarc:
    profiles: ["parsers"]
    image: pipestreamai/fastwarc-grpc:latest
    build: ../fastwarc-grpc
    expose:
      - "50060"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  asr:
    profiles: ["heavy"]
    image: pipestreamai/grpc-asr:latest-cpu
    build:
      context: ../grpc-asr
      dockerfile: Dockerfile.cpu
    expose:
      - "50055"
    # ggml weights; drop whisper models into grpc-asr/models (see that
    # repo's README for download pointers). The CUDA image is a manual
    # swap: image pipestreamai/grpc-asr:latest plus a gpus: all stanza.
    volumes:
      - ../grpc-asr/models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m   # ffmpeg memfd spill for large media
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  enrich:
    profiles: ["heavy"]
    image: pipestreamai/grpc-enrich:latest
    build: ../grpc-enrich
    expose:
      - "50056"   # gRPC; the HTTP shim on 50068 stays network-internal too
    environment:
      # Without a VLM URL the description/chart jobs answer with skip
      # events; the shell tab shows the amber "no VLM endpoint" state.
      ENRICH_VLM_URL: "${ENRICH_VLM_URL:-}"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  vlm-convert:
    profiles: ["heavy"]
    image: pipestreamai/grpc-vlm-convert:latest
    build: ../grpc-vlm-convert
    expose:
      - "50058"   # gRPC
      - "50059"   # HTTP/JSON front end
    environment:
      # External VLM server; conversion fails cleanly (and the shell tab
      # warns) until this points somewhere real.
      GRPC_VLM_ENDPOINT: "${VLM_ENDPOINT:-}"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  lol-html-ui:
    image: pipestreamai/grpc-lol-html-ui:latest
    build:
      context: ../grpc-lol-html
      dockerfile: demos/node-client/Dockerfile
    environment:
      LOL_HTML_ADDR: "lol-html:50057"
      UI_BASE: "/ui/lol-html"
    expose:
      - "8080"
    depends_on:
      - lol-html

  libreoffice-ui:
    image: pipestreamai/grpc-libreoffice-ui:latest
    build:
      context: ../grpc-libreoffice
      dockerfile: frontend/Dockerfile
    environment:
      GRLIBRE_ADDR: "libreoffice:50053"
      UI_BASE: "/ui/libreoffice"
    expose:
      - "8080"
    depends_on:
      - libreoffice

  calamine-ui:
    profiles: ["calamine"]
    image: pipestreamai/grpc-calamine-ui:latest
    build:
      context: ../grpc-calamine
      dockerfile: demos/node-client/Dockerfile
    environment:
      CALAMINE_ADDR: "calamine:50062"
      UI_BASE: "/ui/calamine"
    expose:
      - "8080"
    depends_on:
      - calamine

  # The demo client lives on grpc-pdf-inspector's demo-client branch until
  # that merges; the build context is the repo checkout either way.
  pdf-inspector-ui:
    image: pipestreamai/grpc-pdf-inspector-ui:latest
    build:
      context: ../grpc-pdf-inspector
      dockerfile: demos/node-client/Dockerfile
    environment:
      PDF_ADDR: "pdf-inspector:50067"
      UI_BASE: "/ui/pdf"
      PORT: "8080"   # the viewer's own default is 8093; the shell proxies :8080
    expose:
      - "8080"
    depends_on:
      - pdf-inspector

  epub-ui:
    profiles: ["parsers"]
    image: pipestreamai/grpc-epub-ui:latest
    build:
      context: ../grpc-epub
      dockerfile: demos/node-client/Dockerfile
    environment:
      EPUB_ADDR: "epub:50064"
      UI_BASE: "/ui/epub"
      PORT: "8080"
    expose:
      - "8080"
    depends_on:
      - epub

  xml-ui:
    profiles: ["parsers"]
    image: pipestreamai/grpc-xml-ui:latest
    build:
      context: ../grpc-xml
      dockerfile: demos/node-client/Dockerfile
    environment:
      XML_SERVER_ADDR: "xml:50066"
      UI_BASE: "/ui/xml"
      PORT: "8080"
    expose:
      - "8080"
    depends_on:
      - xml

  markup-ui:
    profiles: ["parsers"]
    image: pipestreamai/grpc-markup-ui:latest
    build:
      context: ../grpc-markup
      dockerfile: demos/node-client/Dockerfile
    environment:
      MARKUP_ADDR: "markup:50065"
      UI_BASE: "/ui/markup"
      PORT: "8080"
    expose:
      - "8080"
    depends_on:
      - markup

  ebcdic-ui:
    profiles: ["parsers"]
    image: pipestreamai/grpc-ebcdic-ui:latest
    build:
      context: ../grpc-ebcdic
      dockerfile: demos/node-client/Dockerfile
    environment:
      EBCDIC_ADDR: "ebcdic:50063"
      UI_BASE: "/ui/ebcdic"
      PORT: "8080"
    expose:
      - "8080"
    depends_on:
      - ebcdic

  email-ui:
    profiles: ["parsers"]
    image: pipestreamai/grpc-email-ui:latest
    build:
      context: ../grpc-email
      dockerfile: demos/node-client/Dockerfile
    environment:
      GRPC_EMAIL_ADDR: "email:50054"
      UI_BASE: "/ui/email"
      PORT: "8080"
    expose:
      - "8080"
    depends_on:
      - email

  # Demo shell: the gRParse parse UI plus one tab per DEMO_UIS entry, each
  # reverse-proxied to that service's own frontend. See
  # examples/web-demo/README.md. Calamine is deliberately not in DEMO_UIS;
  # adding its tab is one entry away
  # (`,calamine=calamine:50062@calamine-ui:8080`, profile `calamine`).
  # Not published on the host; the nginx proxy in front of it is.
  shell:
    image: pipestreamai/grparse-demo-shell:latest
    build:
      context: .
      dockerfile: examples/web-demo/Dockerfile
    expose:
      - "8080"
    environment:
      GRPARSE_TARGET: "grparse:50051"
      # Proxied tabs. The epub/xml/markup/ebcdic/email entries point into
      # the `parsers` profile; with the profile down those tabs simply
      # report unreachable, so the core stack stays bootable alone.
      DEMO_UIS: "lol-html=lol-html:50057@lol-html-ui:8080,libreoffice=libreoffice:50053@libreoffice-ui:8080,pdf=pdf-inspector:50067@pdf-inspector-ui:8080,epub=epub:50064@epub-ui:8080,xml=xml:50066@xml-ui:8080,markup=markup:50065@markup-ui:8080,ebcdic=ebcdic:50063@ebcdic-ui:8080,email=email:50054@email-ui:8080"
      # Native tabs (bridge endpoints in the shell itself, no UI container):
      # poic/fastwarc live in the `parsers` profile, the rest in `heavy`.
      POIC_TARGET: "poic:50052"
      FASTWARC_TARGET: "fastwarc:50060"
      ASR_TARGET: "asr:50055"
      ENRICH_TARGET: "enrich:50056"
      VLM_CONVERT_TARGET: "vlm-convert:50058"
    # The shell reads each service's info RPC through its proto contract; in
    # this image the sibling checkouts do not exist, so bind-mount their
    # proto dirs at the layout the resolver probes ("/<repo>/proto/...").
    volumes:
      - ../grpc-lol-html/proto:/grpc-lol-html/proto:ro
      - ../grpc-libreoffice/proto:/grpc-libreoffice/proto:ro
      - ../grpc-calamine/proto:/grpc-calamine/proto:ro
      - ../grpc-pdf-inspector/proto:/grpc-pdf-inspector/proto:ro
      - ../grpc-epub/proto:/grpc-epub/proto:ro
      - ../grpc-xml/proto:/grpc-xml/proto:ro
      - ../grpc-markup/proto:/grpc-markup/proto:ro
      - ../grpc-ebcdic/proto:/grpc-ebcdic/proto:ro
      - ../grpc-email/proto:/grpc-email/proto:ro
      - ../grpc-enrich/proto:/grpc-enrich/proto:ro
      - ../grpc-asr/proto:/grpc-asr/proto:ro
      - ../grpc-vlm-convert/proto:/grpc-vlm-convert/proto:ro
      - ../fastwarc-grpc/proto:/fastwarc-grpc/proto:ro
      - ../grPOIc/grpoic-api/src/main/proto:/grPOIc/grpoic-api/src/main/proto:ro
    depends_on:
      - grparse
      - lol-html-ui
      - libreoffice-ui
      - pdf-inspector-ui
    read_only: true
    tmpfs:
      - /tmp:size=16m   # the bridge stages the contract protos here at boot
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Front door: the only published port. Proxies the shell (which itself
  # proxies every tab UI); TLS variant and gRPC exposure are documented in
  # compose/README.md. Lazy DNS resolution lets it boot before the parsers.
  proxy:
    image: nginx:1.31-alpine
    ports:
      - "8080:8080"
      # - "8443:8443"   # TLS, once compose/certs/ holds a cert and key
    volumes:
      - ./compose/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./compose/certs:/etc/nginx/certs:ro
    depends_on:
      - shell
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=8m
    cap_drop:
      - ALL
    cap_add:
      # The nginx master chowns its temp dirs and setuids its workers even
      # with everything under tmpfs; these are its minimum capabilities.
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

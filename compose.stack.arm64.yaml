# ARM64 overlay: run the demo stack on arm64 hosts (Apple Silicon Macs, ARM
# servers). Layer it last, after the CPU overlay:
#
#   docker compose -f compose.stack.yaml -f compose.stack.cpu.yaml -f compose.stack.arm64.yaml up
#   docker compose -f compose.stack.yaml -f compose.stack.cpu.yaml -f compose.stack.arm64.yaml --profile parsers up
#
# Why a separate file: every published image in the stack is multi-arch and
# runs natively on arm64, except the three PDF backend services, and one of
# them (pdfium) is in the core profile because gRParse reads every PDF
# through it. Those repos are private, GitHub's free arm runners do not
# cover private repos, and an emulated C++ build takes hours (workspace
# AGENTS.md, "Publishing images"). Their images have no arm64 manifest to
# pull, so this overlay
# pins each of them to linux/amd64 and lets the host's binfmt_misc QEMU
# handler run them under emulation. Docker Desktop ships that handler; on a
# bare Linux arm64 host install it once, e.g.
#   docker run --privileged --rm tonistiigi/binfmt --install amd64
# Without it the pinned containers fail at start with "exec format error".
#
# What it changes, and why:
#   - swaps gRParse to the multi-arch CPU image (same three keys as
#     compose.stack.cpu.yaml, repeated so this file suffices on its own;
#     layering both is harmless, they agree),
#   - pins pdfium (core), qparse (`pdf-backends`) and poppler (`poppler`)
#     to linux/amd64. Emulation makes pdfium's workers slower to spawn, and
#     gRParse dials the backend per document, so a PDF sent in the first
#     seconds of a cold `up` can fail UNAVAILABLE; the next one goes
#     through. Without the binfmt handler pdfium cannot start and every PDF
#     upload fails, while rasters and the other formats still parse,
#   - the openvino overlay stays Intel-only (amd64 by nature); do not layer
#     it on arm64.
#
# `up --build` on an arm64 host builds the pinned services' Dockerfiles for
# amd64 under emulation - hours for these C++ trees. Run from the published
# images, or build on an amd64 host and `docker save | ssh <host> docker
# load` (the second-host recipe in AGENTS.md).
services:
  grparse:
    image: pipestreamai/grparse:${STACK_TAG:-latest}-cpu
    build:
      context: .
      dockerfile: Dockerfile.cpu
    gpus: !reset null
    environment:
      GRPARSE_ORT_EP: cpu

  pdfium:
    platform: linux/amd64

  qparse:
    platform: linux/amd64

  poppler:
    platform: linux/amd64

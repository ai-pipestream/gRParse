# Front-door proxy for the demo stack: one published port in front of the
# demo shell, with an optional TLS variant. See compose/README.md.
#
# Backend names resolve lazily through Docker's embedded DNS, so the proxy
# boots and serves 502 (instead of crashing) while parser services are
# still starting, and recovers on its own when they appear.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The demo streams parse progress over SSE and accepts document uploads
  # of several hundred MiB, so neither direction may be buffered to disk.
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  client_max_body_size 520m;

  server {
    listen 8080;

    location / {
      set $shell http://shell:8080;
      proxy_pass $shell;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # TLS variant. Drop a certificate and key into compose/certs/ (self-signed
  # works for a demo; see compose/README.md), uncomment this block and the
  # 8443 mapping plus certs volume in compose.stack.yaml, and rebuild.
  #
  # server {
  #   listen 8443 ssl;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #
  #   location / {
  #     set $shell http://shell:8080;
  #     proxy_pass $shell;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Forwarded-Proto https;
  #   }
  # }
}

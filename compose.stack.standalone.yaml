# Standalone overlay: run the stack on a host that has no sibling checkouts.
#
#   docker compose -f compose.stack.yaml -f compose.stack.standalone.yaml ... up -d
#
# The shell image carries every peer's proto contract (vendored under
# examples/web-demo/peer-protos and copied in at build time), so the only
# host paths borrowed from siblings are the ASR and optional LightOn
# model directories. ASR mounts ../grpc-asr/models. On a host that only holds this
# directory (krick-1 runs it from ~/parse-stack), put the weights under
# ./protos/grpc-asr/models first, from a workspace checkout:
#
#   rsync -a --mkpath /work/main/grpc-services/grpc-asr/models/ <host>:~/parse-stack/protos/grpc-asr/models/
#
# A missing bind source makes dockerd create an empty root-owned directory in
# place, which is why this overlay rewrites the path rather than leaving it.
services:
  asr:
    volumes: !override
      - ./protos/grpc-asr/models:/models:ro

  # Optional CPU 0.8B service. Prepare the verified model and vision GGUF
  # files before enabling --profile lighton; an empty directory fails startup.
  lighton-ocr:
    volumes: !override
      - type: bind
        source: ${LIGHTON_MODELS_DIR:-./protos/grpc-lighton-ocr/models}
        target: /models
        read_only: true
        bind:
          create_host_path: false

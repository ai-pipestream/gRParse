# Optional observability overlay: Prometheus + Grafana with provisioned
# datasources and dashboards for the gRParse pipeline and corpus evaluation.
#
#   docker compose -f compose.stack.yaml -f compose.stack.observability.yaml --profile observability up -d
#
# Enables GRPARSE_METRICS_PORT=9464 on grparse inside the parse-stack network,
# scrapes grparse:9464 and host.docker.internal:9465 (corpus eval runner with
# --metrics-port 9465) every 5s, and publishes Grafana on
# http://127.0.0.1:${GRAFANA_PORT:-3000} with anonymous Viewer access for local
# inspection.

services:
  grparse:
    expose:
      - "9464"
    environment:
      GRPARSE_METRICS_PORT: "9464"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.15.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    expose:
      - "9090"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./compose/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

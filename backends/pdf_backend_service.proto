syntax = "proto3";

package ai.protomolt.parse.pdf.v1;

import "ai/protomolt/parse/pdf/v1/pdf_backend_types.proto";

option go_package = "protomolt.ai/protos/gen/parse/pdf/v1;pdfv1";
option java_multiple_files = true;
option java_outer_classname = "PdfBackendServiceProto";
option java_package = "ai.protomolt.parse.pdf.v1";

// The common PDF backend contract. Every PDF backend service (grpc-pdfium,
// grpc-qparse, grpc-poppler) implements this one service so backends are
// interchangeable behind a single typed shape and their outputs can be
// compared family by family in the differential harness.
//
// The contract is defined in full up front; what a given backend fills is a
// runtime property declared through Probe, never a schema variation. Field
// numbers are forever: changes to this package are additive only.
//
// Documents are content-addressed (PdfDocument.sha256): the client uploads
// the bytes once and addresses them by hash on later calls, so a per-page
// parse or render loop does not re-upload the document on every RPC. The
// cache policy is server-private; the cache verdicts ride in the typed load
// status of every response, never as bare gRPC errors.

// The operations every backend serves.
service PdfBackendService {
  // Loads the document and reports what this backend will populate for it.
  // Capabilities are per-backend AND per-document. Load failures are typed
  // in the returned capabilities, not gRPC errors; transport and resource
  // failures remain gRPC errors. A probe by hash (data empty, sha256 set)
  // lets a client learn capabilities without re-uploading bytes the server
  // already holds; on a cache miss capabilities.load_status is
  // LOAD_STATUS_BYTES_REQUIRED.
  rpc Probe(ProbeRequest) returns (ProbeResponse);

  // Parses the document into the typed family stream. The first message is
  // always the header (capabilities echo plus the page inventory); page
  // chunks follow in page order, document-level families arrive as their
  // own messages, and the trailer closes the stream with per-family counts.
  // Addressing the document by hash skips the re-upload per page once the
  // bytes are cached; on a cache miss the header carries
  // LOAD_STATUS_BYTES_REQUIRED and the stream ends.
  rpc Parse(ParseRequest) returns (stream ParseResponse);

  // Rasterizes a page range at a DPI and pixel format. Separate from Parse
  // because rasters dominate bytes and callers often want text without
  // pixels. Addressing the document by hash skips the re-upload per page
  // once the bytes are cached; a load failure or cache miss arrives typed
  // in a RenderResponse head, never as a bare gRPC error.
  rpc Render(RenderRequest) returns (stream RenderResponse);

  // Reports the backend's identity and its UI advertisement for the demo
  // shell. Document-free: it loads nothing and needs no bytes, so it is
  // safe to call at any time, including before the first Probe. The
  // backend_name and engine_version fields echo the values
  // BackendCapabilities carries for any document, so an orchestrator can
  // label a backend without loading one.
  rpc GetServiceInfo(ServiceInfoRequest) returns (ServiceInfoResponse);

  // Parse and Render over one bidirectional stream, with the document
  // uploaded in chunks instead of inside one message, so a PDF is not
  // capped by the message size limit and its bytes start crossing the wire
  // before the client has read all of them. The stream opens with a
  // ParseStreamOpen, then PdfChunk messages carry the bytes in order until
  // one marked last. The open's own parse (request 0) answers like Parse
  // once the upload completes; ParsePages and RenderPages may follow at any
  // time after the open, even mid-upload, and are answered like Parse and
  // Render on the same bytes, so a client loads a document once and asks
  // for pages as it needs them. Every request ends with a RequestDone, and
  // the stream ends with one ParseStreamDone after the client half-closes
  // or sends a Cancel for the whole stream. Probe, Parse and Render stay;
  // a server that predates this RPC answers UNIMPLEMENTED, and a client
  // falls back to them.
  rpc ParseStream(stream ParseStreamRequest) returns (stream ParseStreamResponse);
}

// A contiguous range of pages. Zero-based, half-open: begin is the first
// page included, end is the first page excluded. Requests leave the range
// field unset to mean all pages; a set range must have end greater than
// begin.
message PageRange {
  // First page included, zero-based.
  uint32 begin = 1;
  // First page excluded.
  uint32 end = 2;
}

// Request for Probe.
message ProbeRequest {
  // The document to probe.
  PdfDocument document = 1;
}

// Response for Probe.
message ProbeResponse {
  // What this backend will populate for this document.
  BackendCapabilities capabilities = 1;
}

// Heavy-payload switches. Families select WHICH families stream; these
// control how much data rides inside a family. All default to false so the
// lean call is the cheap one.
message ParseOptions {
  // Fill PlacedImage.image with the image bytes. Off, placed images carry
  // geometry and source properties only.
  bool include_image_data = 1;
  // Fill AttachmentMeta.data with the embedded file bytes.
  bool include_attachment_data = 2;
}

// Request for Parse.
message ParseRequest {
  // The document to parse.
  PdfDocument document = 1;
  // Families to emit. Empty means every family the backend marks
  // FAMILY_SUPPORT_SUPPORTED for this document. Requested families the
  // backend cannot fill are declared in the header capabilities and
  // otherwise ignored, never errored.
  repeated PdfFamily families = 2;
  // Pages to emit page-level families for. Unset means all pages.
  // Document-level families are unaffected by the range.
  optional PageRange pages = 3;
  // Heavy-payload switches.
  ParseOptions options = 4;
}

// The first Parse stream message.
message ParseHeader {
  // The same verdicts Probe returns, so a Parse stream is self-describing.
  // When load_status is not LOAD_STATUS_OK the stream ends after this
  // header.
  BackendCapabilities capabilities = 1;
  // The full page inventory (tier 0), regardless of any page range.
  repeated PageInfo pages = 2;
}

// Page-level families for one page. A large page may span several PageChunk
// messages to respect message-size limits; consumers accumulate by
// page_index. Within one page, chunks arrive contiguously and in order.
message PageChunk {
  // Zero-based page index this chunk belongs to.
  uint32 page_index = 1;
  // Text cells in the engine's emission order.
  repeated TextCell text_cells = 2;
  // Images placed on the page.
  repeated PlacedImage images = 3;
  // Link regions.
  repeated Hyperlink hyperlinks = 4;
  // Annotations.
  repeated Annotation annotations = 5;
  // Form field widgets.
  repeated FormField form_fields = 6;
  // Vector path objects.
  repeated VectorShape shapes = 7;
  // The stored page thumbnail, when the document carries one.
  optional EncodedImage thumbnail = 8;
  // The page's typed graphics resources.
  optional DeepResources resources = 9;
}

// A slice of the document font table. May arrive more than once as fonts
// are discovered; font_id values never repeat within a stream.
message FontTableChunk {
  // Font table entries.
  repeated FontRef fonts = 1;
}

// The outline tree, sent whole because outlines are small.
message OutlineChunk {
  // Top-level outline items in document order.
  repeated OutlineNode roots = 1;
}

// The structure tree, sent whole.
message StructTreeChunk {
  // Top-level structure elements in structure order.
  repeated StructNode roots = 1;
}

// All signature fields of the document.
message SignatureChunk {
  // Signatures in document order.
  repeated SignatureInfo signatures = 1;
}

// All document-level JavaScript entries.
message JavaScriptChunk {
  // Entries in name-tree order.
  repeated JavaScriptEntry entries = 1;
}

// A warning attached to the parse, for content the engine skipped or
// repaired without failing the stream.
message ParseWarning {
  // The page the warning is about, when page-scoped.
  optional uint32 page_index = 1;
  // The family the warning is about, when family-scoped.
  optional PdfFamily family = 2;
  // The engine's message.
  string message = 3;
}

// How many items of one family the stream carried.
message FamilyCount {
  // The family counted.
  PdfFamily family = 1;
  // Total items emitted across the stream.
  uint64 count = 2;
}

// The last Parse stream message: totals the harness reconciles against
// what it received, plus warnings.
message ParseTrailer {
  // Per-family item totals for everything emitted on this stream.
  repeated FamilyCount counts = 1;
  // Warnings accumulated during the parse.
  repeated ParseWarning warnings = 2;
}

// One Parse stream message. The header arrives first and the trailer last;
// between them, page chunks arrive in page order and document-level chunks
// may interleave at any point.
message ParseResponse {
  // Exactly one chunk kind per stream message.
  oneof payload {
    // First message: capabilities plus page inventory.
    ParseHeader header = 1;
    // Page-level families for one page.
    PageChunk page = 2;
    // Document metadata.
    DocMeta doc_meta = 3;
    // Encryption details, only for encrypted documents.
    EncryptionInfo encryption = 4;
    // Font table entries.
    FontTableChunk fonts = 5;
    // One embedded font program (its own message because programs are
    // large).
    EmbeddedFont embedded_font = 6;
    // The outline tree.
    OutlineChunk outline = 7;
    // One attachment (its own message because file bytes are large).
    AttachmentMeta attachment = 8;
    // Signature fields.
    SignatureChunk signatures = 9;
    // JavaScript entries.
    JavaScriptChunk javascript = 10;
    // The structure tree.
    StructTreeChunk struct_tree = 11;
    // Last message: totals and warnings.
    ParseTrailer trailer = 12;
  }
}

// Request for Render.
message RenderRequest {
  // The document to render.
  PdfDocument document = 1;
  // Pages to render. Unset means all pages.
  optional PageRange pages = 2;
  // Resolution in dots per inch; must be positive.
  double dpi = 3;
  // Requested pixel layout of the output.
  PixelFormat pixel_format = 4;
  // Background painted behind transparent content. Unset means opaque
  // white.
  optional Color background = 5;
  // Skip drawing annotation appearances into the raster. Engines draw them
  // by default, so the false default matches engine behavior.
  bool omit_annotations = 6;
}

// One rendered page.
message PageRaster {
  // Zero-based page index.
  uint32 page_index = 1;
  // Width in pixels.
  uint32 width_px = 2;
  // Height in pixels.
  uint32 height_px = 3;
  // Bytes per row.
  uint32 stride_bytes = 4;
  // The pixel layout actually produced.
  PixelFormat pixel_format = 5;
  // The DPI actually rendered.
  double dpi = 6;
  // Pixel data, top-down rows, height_px * stride_bytes bytes.
  bytes pixels = 7;
}

// The load verdict a Render stream carries when it needs saying. Render has
// no capabilities echo like ParseHeader, so a load failure, including a
// cache miss on a request addressed by hash, is typed here instead of
// surfacing as a bare gRPC error.
message RenderHeader {
  // Outcome of loading the document.
  LoadStatus load_status = 1;
  // The engine's message when load_status is not LOAD_STATUS_OK.
  optional string load_detail = 2;
}

// One Render stream message: pages arrive in page order, one raster per
// message.
message RenderResponse {
  // The rendered page.
  PageRaster raster = 1;
  // The load verdict. Exactly one of raster and head is set per stream
  // message. When the document fails to load, including a cache miss on a
  // request addressed by hash, the stream carries exactly one message with
  // head set to a load_status other than LOAD_STATUS_OK and then ends. On
  // success a server may omit head entirely and send only rasters, so a
  // message with raster set is the success signal.
  RenderHeader head = 2;
}

// The first ParseStream message: what the document is and what the open's
// own parse (request 0) asks for. families, pages and options mean what
// they mean on ParseRequest.
message ParseStreamOpen {
  // Families the open's parse emits; empty means every supported family.
  repeated PdfFamily families = 1;
  // Pages the open's parse emits page-level families for. Unset means all
  // pages.
  optional PageRange pages = 2;
  // Heavy-payload switches for the open's parse.
  ParseOptions options = 3;
  // Password to open the document with, as PdfDocument.password. It
  // applies to every request on the stream.
  optional string password = 4;
  // Caller-chosen correlation id, as PdfDocument.doc_id.
  optional string doc_id = 5;
  // Lowercase hex SHA-256 of the whole upload. When set, the server checks
  // the assembled bytes against it and answers LOAD_STATUS_HASH_MISMATCH
  // in the open's header when they differ; a match MAY be cached for later
  // Probe, Parse and Render calls addressed by hash.
  optional string sha256 = 6;
  // Total bytes the upload will carry. When set, an upload that runs past
  // it, or ends short of it, fails the stream with INVALID_ARGUMENT.
  optional uint64 declared_size = 7;
  // Answer the open with the header alone (capabilities and the page
  // inventory, what Probe and a Parse header carry) and no families, for a
  // client that asks for pages later with ParsePages. families, pages and
  // options are then ignored.
  bool header_only = 8;
}

// A slice of the document bytes. Chunks arrive in order with no gaps:
// offset is the count of bytes sent before this chunk. A chunk out of
// order, or any chunk after the last, fails the stream with
// INVALID_ARGUMENT, as does a half-close before the last chunk.
message PdfChunk {
  // Byte offset of data within the document.
  uint64 offset = 1;
  // The bytes. May be empty only on the last chunk.
  bytes data = 2;
  // This chunk completes the upload.
  bool last = 3;
}

// Parse more of the stream's document, answered exactly like Parse:
// header, page chunks and document-level families, trailer.
message ParsePages {
  // Caller-chosen id echoed on every response message for this request.
  // Nonzero (0 is the open's parse) and never reused on one stream;
  // anything else fails the stream with INVALID_ARGUMENT.
  uint32 request_id = 1;
  // As ParseRequest.families.
  repeated PdfFamily families = 2;
  // As ParseRequest.pages.
  optional PageRange pages = 3;
  // As ParseRequest.options.
  ParseOptions options = 4;
}

// Rasterize pages of the stream's document, answered exactly like Render.
message RenderPages {
  // Caller-chosen id, under the same rules as ParsePages.request_id.
  uint32 request_id = 1;
  // As RenderRequest.pages.
  optional PageRange pages = 2;
  // As RenderRequest.dpi.
  double dpi = 3;
  // As RenderRequest.pixel_format.
  PixelFormat pixel_format = 4;
  // As RenderRequest.background.
  optional Color background = 5;
  // As RenderRequest.omit_annotations.
  bool omit_annotations = 6;
}

// Stop work the client no longer wants.
message Cancel {
  // The request to stop. Unset cancels the whole stream: the server stops
  // every request, sends ParseStreamDone with cancelled set, and ends the
  // stream OK without reading further. A request that already finished,
  // or an id never sent, is ignored.
  optional uint32 request_id = 1;
}

// One client message on ParseStream. The first is the open; chunks follow,
// with page requests and cancels interleaved as the client likes.
message ParseStreamRequest {
  // Exactly one message kind per stream message.
  oneof payload {
    // First message, exactly once.
    ParseStreamOpen open = 1;
    // Document bytes.
    PdfChunk chunk = 2;
    // A parse of more pages or families.
    ParsePages parse = 3;
    // A render of pages.
    RenderPages render = 4;
    // Stop a request, or the stream.
    Cancel cancel = 5;
  }
}

// How one request on a ParseStream ended. Load failures are not outcomes:
// they ride typed in the request's header or render head, as on Parse and
// Render, and the request still ends OK.
enum RequestOutcome {
  // Never emitted.
  REQUEST_OUTCOME_UNSPECIFIED = 0;
  // Every message for the request was sent.
  REQUEST_OUTCOME_OK = 1;
  // A Cancel stopped the request before it finished.
  REQUEST_OUTCOME_CANCELLED = 2;
  // The request was malformed (a bad page range or dpi), where Parse or
  // Render would answer INVALID_ARGUMENT.
  REQUEST_OUTCOME_INVALID_ARGUMENT = 3;
  // The request needed more than the server allows (a raster past its
  // pixel limit, no free worker for the whole wait).
  REQUEST_OUTCOME_RESOURCE_EXHAUSTED = 4;
  // The document never loaded (the open's header carried a load status
  // other than LOAD_STATUS_OK), so the request was not served.
  REQUEST_OUTCOME_NOT_LOADED = 5;
  // The engine or a worker failed while serving the request.
  REQUEST_OUTCOME_ENGINE_ERROR = 6;
  // The server stopped the request for taking too long.
  REQUEST_OUTCOME_DEADLINE_EXCEEDED = 7;
}

// The last message of one request: request 0 (the open's parse) or a
// ParsePages or RenderPages.
message RequestDone {
  // How the request ended.
  RequestOutcome outcome = 1;
  // The server's message when outcome is not REQUEST_OUTCOME_OK.
  optional string detail = 2;
}

// The last message of a ParseStream.
message ParseStreamDone {
  // Document bytes the server received.
  uint64 bytes_received = 1;
  // Lowercase hex SHA-256 of the bytes received, so a client can confirm
  // the upload arrived whole. Empty when the upload never completed.
  string sha256 = 2;
  // The stream ended on a Cancel for the whole stream.
  bool cancelled = 3;
}

// One server message on ParseStream. Messages of different requests may
// interleave; within one request they keep the order Parse or Render
// gives them. The open's header is the first message of the stream, and no
// other request is answered before it.
message ParseStreamResponse {
  // The request this message answers: 0 for the open's parse, otherwise a
  // ParsePages or RenderPages request_id. Unused on done.
  uint32 request_id = 1;
  // Exactly one message kind per stream message.
  oneof payload {
    // A Parse stream message (header, page chunk, document-level family,
    // trailer) for request 0 or a ParsePages.
    ParseResponse parse = 2;
    // A Render stream message for a RenderPages.
    RenderResponse render = 3;
    // The request named by request_id has ended.
    RequestDone request_done = 4;
    // Last message of the stream.
    ParseStreamDone done = 5;
  }
}

// Request for GetServiceInfo. Empty: it exists so future options have a
// place to land.
message ServiceInfoRequest {}

// Response for GetServiceInfo: the backend's identity, independent of any
// document. backend_name and engine_version carry the same values
// BackendCapabilities reports for every document.
message ServiceInfoResponse {
  // The backend service's stable name, for example "grpc-pdfium".
  string backend_name = 1;
  // The underlying engine and its exact pinned version, for example
  // "pdfium 6721".
  string engine_version = 2;
  // The backend build version, for example the image tag the server was
  // built from.
  string build_version = 3;
  // The UI advertisement for the shared demo shell.
  UiInfo ui = 4;
}

// The UI advertisement every service in the family carries in its info
// response, so a demo shell can mount the service's web UI under a tab.
message UiInfo {
  // Tab title, for example "PDFium".
  string title = 1;
  // Shell mount path, for example "/ui/pdfium".
  string path = 2;
  // One line, used as the tab tooltip.
  string description = 3;
}

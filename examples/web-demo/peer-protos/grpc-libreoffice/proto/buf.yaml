version: v2
lint:
  use:
    - STANDARD
    - COMMENTS
  ignore_only:
    # The document schema is vendored for parity with the upstream JSON
    # schema (canonical copy in the gRParse repo); its comment coverage
    # follows that schema, not this repo's comment rule.
    COMMENTS:
      - ai/pipestream/document/v1/document.proto
      # The OpenNLP contracts document.proto imports are vendored byte-identical
      # from the gRParse repo (collectors/); their comment coverage follows
      # OpenNLP's upstream files, not this repo's comment rule.
      - org/apache/opennlp/grpc/v1/opennlp_annotations.proto
      - org/apache/opennlp/grpc/v1/opennlp_document.proto
breaking:
  use:
    - FILE

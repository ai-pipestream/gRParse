<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASR — streaming speech-to-text demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>ASR</h1>
      <span class="subtitle">streaming speech-to-text via whisper.cpp</span>
    </div>
    <div id="health" class="health pending">checking service…</div>
  </header>

  <section id="dropzone" class="dropzone">
    <input id="file-input" type="file" accept="audio/*,video/*,.wav,.mp3,.m4a,.flac,.ogg,.opus,.mp4,.mkv,.webm" hidden />
    <p><strong>Drop an audio or video file here</strong> or click to choose one.</p>
    <p class="hint">Segments stream in below as the decoder commits them — no waiting for the whole file. Video is demuxed for its audio track.</p>
    <div class="warc-options" id="asr-options">
      <label>model
        <select id="opt-model"><option value="">(model list unavailable)</option></select>
      </label>
      <label>language <input type="text" id="opt-language" size="4" placeholder="auto" /></label>
      <label>
        <select id="opt-task">
          <option value="transcribe">transcribe</option>
          <option value="translate">translate to English</option>
        </select>
      </label>
      <label><input type="checkbox" id="opt-word-timestamps" /> word timestamps</label>
    </div>
  </section>

  <section id="stats" class="stats" hidden>
    <div class="stat"><span id="stat-segments">0</span><label>segments</label></div>
    <div class="stat"><span id="stat-media">—</span><label>media</label></div>
    <div class="stat"><span id="stat-language">—</span><label>language</label></div>
    <div class="stat"><span id="stat-elapsed">0.0s</span><label>elapsed</label></div>
  </section>

  <main id="results" class="results"></main>

  <script src="asr.js"></script>
</body>
</html>

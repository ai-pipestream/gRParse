name: Publish Image

# Builds the full image (the build stage runs the test suite), boot-proofs the
# runtime stage with scripts/smoke-test.sh, and only then pushes it to
# docker.io/pipestreamai and our Forgejo container registry. Dispatch this
# from Forgejo (git.rokkon.com), where the DOCKER_USER/DOCKER_TOKEN and
# CICD_TOKEN org secrets live; on the GitHub mirror the secrets are absent and
# a stray dispatch fails at login, pushing nothing.
#
# amd64 only: the image is CUDA-specific and the arm64 fleet has no NVIDIA
# GPUs to serve it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (for example 0.1.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub (docker.io)
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: git.rokkon.com
          username: ${{ github.actor }}
          password: ${{ secrets.CICD_TOKEN }}
      - name: Build image (runs the test suite in the build stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: |
            docker.io/pipestreamai/grparse:${{ inputs.version }}
            docker.io/pipestreamai/grparse:latest
            git.rokkon.com/ai-pipestream/grparse:${{ inputs.version }}
            git.rokkon.com/ai-pipestream/grparse:latest
      - name: Boot-proof the image before any push
        # A build is not done until the artifact has started up for real:
        # library closure plus boot-to-main, no GPU or models needed.
        run: ./scripts/smoke-test.sh docker.io/pipestreamai/grparse:${{ inputs.version }}
      - name: Push all tags
        run: |
          for tag in \
            docker.io/pipestreamai/grparse:${{ inputs.version }} \
            docker.io/pipestreamai/grparse:latest \
            git.rokkon.com/ai-pipestream/grparse:${{ inputs.version }} \
            git.rokkon.com/ai-pipestream/grparse:latest; do
            docker push "$tag"
          done

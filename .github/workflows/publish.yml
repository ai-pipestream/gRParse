name: Publish Image

# Builds every image variant (the build stage runs the test suite),
# boot-proofs the runtime stage with scripts/smoke-test.sh, and only then
# gives it a public name on docker.io/pipestreamai. Three variants:
# Dockerfile (CUDA, owns the plain :latest tag, linux/amd64 by nature),
# Dockerfile.cpu (:latest-cpu, a linux/amd64 + linux/arm64 manifest list),
# Dockerfile.openvino (:latest-openvino, Intel, linux/amd64 by nature).
#
# When it runs and what it tags (docs/RELEASING.md):
#   push to main          republishes :latest, :latest-cpu, :latest-openvino
#   push of a v* tag      the same, plus :<version>, :<version>-cpu,
#                         :<version>-openvino, <version> = the tag minus its v
#   workflow_dispatch     the same as main, plus the version tags when the
#                         optional version input is given
# A version has to equal the project() version in CMakeLists.txt (which is
# what the served GetServiceInfo string reports); the `version` job refuses
# anything else, so a tag and its image never disagree.
#
# Build once, gate, then name. `load: true` cannot carry attestations and a
# multi-platform image cannot be loaded at all, so every leg is built once
# with provenance (mode=max) and SBOM attestations and pushed BY DIGEST
# ONLY: no tag points at it, it is invisible under any public name. The leg
# then pulls that digest back and runs the smoke test on its own
# architecture; only a digest that passed is recorded as an artifact. The
# `publish` job assembles the recorded digests into the tagged manifest
# lists with `docker buildx imagetools create` (scripts/publish-manifests.sh)
# and inspects the result: the index must list exactly the platforms the
# run built and one attestation manifest per platform, or the job fails.
# So the smoke gate still runs before any tag exists, and the attestations
# on the published image are the ones the build produced. A rebuild with
# cache would have been the alternative; it doubles the build time and
# would smoke-test a different artifact than the one it publishes.
#
# The arm64 CPU leg builds natively on GitHub's hosted ubuntu-24.04-arm
# runner (free for this public repository); no QEMU anywhere. Each leg runs
# the full in-build ctest battery natively and the smoke test on its own
# architecture.
#
# Docker Hub credentials come from the DOCKER_USER / DOCKER_TOKEN org secrets
# on GitHub. The Forgejo registry (git.rokkon.com) receives the same digests
# and tags only when its CICD_TOKEN secret exists; elsewhere that login and
# those names are skipped.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to tag besides :latest (for example 0.2.0); must equal the
          project() version in CMakeLists.txt. Leave empty to republish only
          the :latest tags.
        required: false
        type: string

permissions:
  contents: read

env:
  HUB_REPO: docker.io/pipestreamai/grparse
  FORGEJO_REPO: git.rokkon.com/ai-pipestream/grparse

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      # Empty on a plain main push: only the :latest tags are republished.
      version: ${{ steps.resolve.outputs.version }}
      # Always set: the version the built server serves, for the OCI label.
      served: ${{ steps.resolve.outputs.served }}
    steps:
      - uses: actions/checkout@v7
      - name: Take the version from the v* tag or the dispatch input
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="$INPUT_VERSION" ;;
          esac
          served=$(./scripts/cmake-version.sh --expect "$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "served=$served" >> "$GITHUB_OUTPUT"
          echo "publishing version '${version:-<latest only>}' (served version $served)"

  build:
    name: Build ${{ matrix.variant }} ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            dockerfile: Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - variant: cpu
            dockerfile: Dockerfile.cpu
            platform: linux/amd64
            runner: ubuntu-latest
          - variant: cpu
            dockerfile: Dockerfile.cpu
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - variant: openvino
            dockerfile: Dockerfile.openvino
            platform: linux/amd64
            runner: ubuntu-latest
    env:
      CICD_TOKEN: ${{ secrets.CICD_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub (docker.io)
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to Forgejo container registry
        if: ${{ env.CICD_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          registry: git.rokkon.com
          username: ${{ github.actor }}
          password: ${{ secrets.CICD_TOKEN }}
      - name: Name the repositories this leg pushes to by digest
        id: names
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          names="$HUB_REPO"
          if [ -n "$CICD_TOKEN" ]; then
            names="$names,$FORGEJO_REPO"
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "platform_pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
      - name: Build (runs the test suite in the build stage) and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.served }}
          outputs: type=image,"name=${{ steps.names.outputs.names }}",push-by-digest=true,name-canonical=true,push=true
      - name: Boot-proof the pushed digest before it gets a name
        # A build is not done until the artifact has started up for real:
        # library closure plus boot-to-main, no GPU or models needed. The
        # image under test is the exact digest that was pushed, pulled
        # back from the registry, so what passes here is what gets tagged.
        env:
          IMAGE: ${{ env.HUB_REPO }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          ./scripts/smoke-test.sh "$IMAGE"
      - name: Record the digest that passed
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload the digest for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.variant }}-${{ steps.names.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.variant }}
    needs: [version, build]
    # Runs even when a build leg failed, so one variant's failure does not
    # hold the others back: a variant whose leg is missing has fewer
    # digests than platforms and scripts/publish-manifests.sh refuses it.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            suffix: ''
            platforms: linux/amd64
          - variant: cpu
            suffix: -cpu
            platforms: linux/amd64,linux/arm64
          - variant: openvino
            suffix: -openvino
            platforms: linux/amd64
    env:
      CICD_TOKEN: ${{ secrets.CICD_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the digests that passed their smoke gate
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub (docker.io)
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to Forgejo container registry
        if: ${{ env.CICD_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          registry: git.rokkon.com
          username: ${{ github.actor }}
          password: ${{ secrets.CICD_TOKEN }}
      - name: Create the manifest lists and prove them
        env:
          SUFFIX: ${{ matrix.suffix }}
          PLATFORMS: ${{ matrix.platforms }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          repos=(--repo "$HUB_REPO")
          if [ -n "$CICD_TOKEN" ]; then
            repos+=(--repo "$FORGEJO_REPO")
          fi
          digests=()
          for file in "$RUNNER_TEMP"/digests/*; do
            [ -e "$file" ] && digests+=("$(basename "$file")")
          done
          ./scripts/publish-manifests.sh --suffix "$SUFFIX" --version "$VERSION" \
            --platforms "$PLATFORMS" "${repos[@]}" "${digests[@]}"

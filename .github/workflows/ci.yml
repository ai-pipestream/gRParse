name: C++ build and contract tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cuda-image:
    # Heavy image build: the Forgejo `heavy` label exists only on krick-host
    # (64g/20cpu). nas-1/nas-2 cap jobs at 16g/5cpu and openvino-image failed
    # there (run 453). GitHub has no `heavy` runner, so it keeps ubuntu-latest.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'heavy' }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to dhi.io
        # Docker Hardened Images need an authenticated pull (the Dockerfile.models
        # runtime stage is dhi.io/debian-base). Same secrets as publish-models.yml.
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Free runner disk for the seeded build
        # GitHub's hosted runner only: the seed image (about 9 GB unpacked
        # for cpu, more with the CUDA devel base), its 4.4 GB tree copied
        # into /build and the build outgrow the runner's free space. The
        # preinstalled SDKs removed here are unused by this job.
        if: ${{ github.server_url == 'https://github.com' }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Log in to Docker Hub (docker.io)
        # The deps seeds live on Docker Hub; logging in also lifts the
        # anonymous pull rate limit for the public bases.
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Find the deps seed for this build
        id: seed
        # Forgejo's runner keeps its Docker daemon between jobs, and with it
        # the deps stage and a filled /build, so it never pulls a seed it does
        # not already hold (scripts/find-seed.sh --no-pull).
        env:
          SEED_FLAGS: ${{ github.server_url != 'https://github.com' && '--no-pull' || '' }}
        run: sh scripts/find-seed.sh $SEED_FLAGS Dockerfile cuda amd64 >> "$GITHUB_OUTPUT"
      - name: Restore the compile cache
        # GitHub's hosted runner only: its builder starts empty, so the ccache
        # mount the build compiles through travels in the Actions cache
        # (scripts/ccache-mount.sh). Forgejo's daemon keeps the mount itself.
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-cuda-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-cuda-amd64-
      - name: Load the compile cache into the build's ccache mount
        if: ${{ github.server_url == 'https://github.com' }}
        run: sh scripts/ccache-mount.sh load cuda amd64 "$RUNNER_TEMP/ccache"
      - name: Build full image and run non-GPU tests
        # The full build (not just the build stage) also assembles the
        # runtime stage, so a runtime library missing from the staged
        # closure fails here instead of at deploy time.
        run: |
          docker build --progress=plain \
            --build-arg GRPARSE_BUILD_JOBS="$(scripts/build-jobs.sh)" \
            --build-arg GRPARSE_DEPS_IMAGE="${{ steps.seed.outputs.image }}" \
            --build-arg GRPARSE_REVISION="${{ github.sha }}" -t grparse-ci-cuda .
      - name: Copy the compile cache out of the ccache mount
        if: ${{ github.server_url == 'https://github.com' }}
        run: sh scripts/ccache-mount.sh save cuda amd64 "$RUNNER_TEMP/ccache"
      - name: Save the compile cache
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-cuda-amd64-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Boot-proof the runtime image
        # Library closure + boot-to-main.  A green build with an unbootable
        # binary has shipped before (ZXing flipping BUILD_SHARED_LIBS); this
        # gate makes that impossible to miss.
        run: ./scripts/smoke-test.sh grparse-ci-cuda

  openvino-image:
    # Heavy image build: the Forgejo `heavy` label exists only on krick-host
    # (64g/20cpu). nas-1/nas-2 cap jobs at 16g/5cpu and openvino-image failed
    # there (run 453). GitHub has no `heavy` runner, so it keeps ubuntu-latest.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'heavy' }}
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk for the seeded build
        # GitHub's hosted runner only: the seed image (about 9 GB unpacked
        # for cpu, more with the CUDA devel base), its 4.4 GB tree copied
        # into /build and the build outgrow the runner's free space. The
        # preinstalled SDKs removed here are unused by this job.
        if: ${{ github.server_url == 'https://github.com' }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Log in to Docker Hub (docker.io)
        # The deps seeds live on Docker Hub; logging in also lifts the
        # anonymous pull rate limit for the public bases.
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Find the deps seed for this build
        id: seed
        # Forgejo's runner keeps its Docker daemon between jobs, and with it
        # the deps stage and a filled /build, so it never pulls a seed it does
        # not already hold (scripts/find-seed.sh --no-pull).
        env:
          SEED_FLAGS: ${{ github.server_url != 'https://github.com' && '--no-pull' || '' }}
        run: sh scripts/find-seed.sh $SEED_FLAGS Dockerfile.openvino openvino amd64 >> "$GITHUB_OUTPUT"
      - name: Restore the compile cache
        # GitHub's hosted runner only: its builder starts empty, so the ccache
        # mount the build compiles through travels in the Actions cache
        # (scripts/ccache-mount.sh). Forgejo's daemon keeps the mount itself.
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-openvino-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-openvino-amd64-
      - name: Load the compile cache into the build's ccache mount
        if: ${{ github.server_url == 'https://github.com' }}
        run: sh scripts/ccache-mount.sh load openvino amd64 "$RUNNER_TEMP/ccache"
      - name: Build Intel/OpenVINO image and run non-GPU tests
        run: |
          docker build --progress=plain -f Dockerfile.openvino \
            --build-arg GRPARSE_BUILD_JOBS="$(scripts/build-jobs.sh)" \
            --build-arg GRPARSE_DEPS_IMAGE="${{ steps.seed.outputs.image }}" \
            --build-arg GRPARSE_REVISION="${{ github.sha }}" -t grparse-ci-openvino .
      - name: Copy the compile cache out of the ccache mount
        if: ${{ github.server_url == 'https://github.com' }}
        run: sh scripts/ccache-mount.sh save openvino amd64 "$RUNNER_TEMP/ccache"
      - name: Save the compile cache
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-openvino-amd64-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Boot-proof the runtime image
        run: ./scripts/smoke-test.sh grparse-ci-openvino
      - name: Verify model fetch and real CPU embeddings
        # Exercise the CPU reference through the shipped executable. GPU
        # inference still requires separate tests on physical hardware.
        # The job runs in a container that talks to the host Docker daemon,
        # so a bind mount of a job-container path ($RUNNER_TEMP) resolves on
        # the host and arrives empty. Copy the models into a named volume
        # through the Docker API instead; this works on hosted runners too.
        run: |
          bash scripts/test/fetch-embedding-model-test.sh
          scripts/fetch-embedding-model.sh --backend all --dir "$RUNNER_TEMP/embedding-model"
          vol="grparse-ci-embedding-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          trap 'docker volume rm -f "$vol" >/dev/null' EXIT
          docker volume create "$vol" >/dev/null
          tar -C "$RUNNER_TEMP/embedding-model" -cf - . | \
            docker run --rm -i --user 0 -v "$vol:/embedding-models" --entrypoint tar \
              grparse-ci-openvino -xf - -C /embedding-models
          for check in grparse-embedding-check grparse-embedding-reference; do
            docker run --rm --read-only --tmpfs /tmp --cpus 2 --memory 2g \
              -v "$vol:/embedding-models:ro" \
              -e GRPARSE_EMBEDDING_TEST_MODELS=/embedding-models \
              -e GRPARSE_EMBEDDING_TEST_REQUIRE=1 \
              --entrypoint "$check" grparse-ci-openvino
          done

  # Dockerfile.cpu is the multi-arch :latest-cpu image; publish.yml would
  # otherwise build it first on push to main. amd64 is enough to gate a PR.
  # This job also runs the model-backed goldens (layout, table structure,
  # figure classifier, hf/1 tokenizer): the grparse-models fetch stage
  # downloads the pinned files, sha-checked against models/MANIFEST, into
  # the build context's models/, and GRPARSE_TEST_REQUIRE_MODELS=1 makes a
  # missing model fail the in-build ctest instead of skipping.
  cpu-image:
    # Heavy image build: the Forgejo `heavy` label exists only on krick-host
    # (64g/20cpu). nas-1/nas-2 cap jobs at 16g/5cpu and openvino-image failed
    # there (run 453). GitHub has no `heavy` runner, so it keeps ubuntu-latest.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'heavy' }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to dhi.io
        # Docker Hardened Images need an authenticated pull (the Dockerfile.models
        # runtime stage is dhi.io/debian-base). Same secrets as publish-models.yml.
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Provide the pinned model files
        run: |
          docker build --progress=plain -f Dockerfile.models \
            --build-arg MODELS_LAYOUT=all --build-arg MODELS_TOKENIZER=1 -t grparse-ci-models .
          id=$(docker create grparse-ci-models)
          docker cp "$id:/models/." models/
          docker rm "$id"
          scripts/fetch-models.sh --verify --dir models --layout all --tokenizer
      - name: Free runner disk for the seeded build
        # GitHub's hosted runner only: the seed image (about 9 GB unpacked
        # for cpu, more with the CUDA devel base), its 4.4 GB tree copied
        # into /build and the build outgrow the runner's free space. The
        # preinstalled SDKs removed here are unused by this job.
        if: ${{ github.server_url == 'https://github.com' }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Log in to Docker Hub (docker.io)
        # The deps seeds live on Docker Hub; logging in also lifts the
        # anonymous pull rate limit for the public bases.
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Find the deps seed for this build
        id: seed
        # Forgejo's runner keeps its Docker daemon between jobs, and with it
        # the deps stage and a filled /build, so it never pulls a seed it does
        # not already hold (scripts/find-seed.sh --no-pull).
        env:
          SEED_FLAGS: ${{ github.server_url != 'https://github.com' && '--no-pull' || '' }}
        run: sh scripts/find-seed.sh $SEED_FLAGS Dockerfile.cpu cpu amd64 >> "$GITHUB_OUTPUT"
      - name: Restore the compile cache
        # GitHub's hosted runner only: its builder starts empty, so the ccache
        # mount the build compiles through travels in the Actions cache
        # (scripts/ccache-mount.sh). Forgejo's daemon keeps the mount itself.
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-cpu-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-cpu-amd64-
      - name: Load the compile cache into the build's ccache mount
        if: ${{ github.server_url == 'https://github.com' }}
        run: sh scripts/ccache-mount.sh load cpu amd64 "$RUNNER_TEMP/ccache"
      - name: Build CPU image and run the tests, model goldens included
        run: |
          docker build --progress=plain -f Dockerfile.cpu \
            --build-arg GRPARSE_BUILD_JOBS="$(scripts/build-jobs.sh)" \
            --build-arg GRPARSE_DEPS_IMAGE="${{ steps.seed.outputs.image }}" \
            --build-arg GRPARSE_REVISION="${{ github.sha }}" \
            --build-arg GRPARSE_TEST_REQUIRE_MODELS=1 -t grparse-ci-cpu .
      - name: Copy the compile cache out of the ccache mount
        if: ${{ github.server_url == 'https://github.com' }}
        run: sh scripts/ccache-mount.sh save cpu amd64 "$RUNNER_TEMP/ccache"
      - name: Save the compile cache
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-cpu-amd64-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Boot-proof the runtime image
        run: ./scripts/smoke-test.sh grparse-ci-cpu
      # The storage connector, remote source and chart end to end suites
      # skip in the in-build ctest because they need emulators. Here the
      # scripts developers run locally start those emulators (fake-gcs-server,
      # Azurite, RustFS over http and self-signed https, the mock Google token
      # endpoint and Drive API, local http and https origins, the published
      # grpc-enrich in front of an emulated OpenAI-compatible VLM) and run
      # each suite from the e2e image. A script fails when an emulator never
      # opens its port (or RustFS never answers /health), and a binary's skip
      # (exit 77) fails the step too.
      # GitHub's hosted runner only: the scripts bind-mount host temporary
      # directories into the emulators and reach them on 127.0.0.1, which a
      # Forgejo job container talking to the host daemon cannot do.
      - name: Build the end to end image
        # Same arguments as the build above, so BuildKit reuses its build
        # stage; the e2e target adds only the three test binaries on the
        # runtime base and is never published.
        if: ${{ github.server_url == 'https://github.com' }}
        run: |
          docker build --progress=plain -f Dockerfile.cpu --target e2e \
            --build-arg GRPARSE_BUILD_JOBS="$(scripts/build-jobs.sh)" \
            --build-arg GRPARSE_DEPS_IMAGE="${{ steps.seed.outputs.image }}" \
            --build-arg GRPARSE_REVISION="${{ github.sha }}" \
            --build-arg GRPARSE_TEST_REQUIRE_MODELS=1 -t grparse-ci-cpu-e2e .
      - name: Install the mock Google endpoint's dependency
        if: ${{ github.server_url == 'https://github.com' }}
        run: |
          python3 -c 'import cryptography' 2>/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-cryptography
          }
      - name: Storage connectors end to end (fake-gcs-server, Azurite, RustFS, mock Google)
        if: ${{ github.server_url == 'https://github.com' }}
        run: scripts/test/storage-connectors-e2e-test.sh grparse-ci-cpu-e2e
      - name: Remote sources end to end (RustFS http and https, http and https origins)
        if: ${{ github.server_url == 'https://github.com' }}
        run: scripts/test/remote-sources-e2e-test.sh grparse-ci-cpu-e2e
      - name: Chart outputs end to end (grpc-enrich and an emulated VLM)
        if: ${{ github.server_url == 'https://github.com' }}
        # A released grpc-enrich, so a push to that repo cannot turn this
        # repo's PRs red; move the tag when the chart contract moves.
        run: scripts/test/chart-outputs-e2e-test.sh grparse-ci-cpu-e2e pipestreamai/grpc-enrich:0.3.0

  # The demo shell image carries every peer's proto contract (vendored under
  # examples/web-demo/peer-protos); the Dockerfile's own build gate loads
  # them all, and the unit tests cover the registry, the vendored trees, and
  # the sync script. CI has no sibling checkouts, so the sibling-vs-vendored
  # diff (sync-peer-protos.sh --check) stays a developer-side step.
  demo-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to dhi.io
        # web-demo Dockerfile pulls dhi.io/node (digest-pinned).
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Unit tests for the peer registry and vendored protos
        # The runner's own Node (>= 20, which package.json requires) is enough.
        working-directory: examples/web-demo
        run: |
          npm ci --omit=dev
          npm test
      - name: Build the shell image (runs node server.js --check-protos as a build gate)
        run: docker build --progress=plain -f examples/web-demo/Dockerfile -t grparse-ci-demo-shell .
      - name: Load every peer contract inside the built image
        run: docker run --rm grparse-ci-demo-shell node server.js --check-protos

  # Short fuzz window on the raster ingest door (the only in-process code that
  # touches attacker-controlled bytes before a model runs; PDFs go to a
  # PdfBackendService).  The fuzz project builds
  # standalone in seconds - no gRPC or ONNX Runtime fetch - so this fits in a
  # PR gate.  Long campaigns run manually; see fuzz/README.md.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Clang and the ingest-door dependencies
        # The self-hosted runner image runs jobs as root and ships no sudo;
        # GitHub-hosted runners need it. Use sudo only when it exists.
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            clang libclang-rt-dev ninja-build cmake pkg-config \
            libopencv-dev
      - name: Build the fuzzers
        run: |
          cmake -S fuzz -B build-fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-fuzz
      - name: Fuzz the raster ingest door
        env:
          LSAN_OPTIONS: suppressions=tests/lsan.supp
        run: |
          mkdir -p corpus-raster
          ./build-fuzz/raster-source-fuzzer corpus-raster tests/data \
            -max_total_time=90 -max_len=1048576 -rss_limit_mb=4096 -print_final_stats=1

  # The Python under eval/: the corpus runner and drift analyzer, the S3
  # battery checks, the scorecard metrics, ruff, and the one-command corpus
  # eval wrapper's dry run. Stdlib only; no service, no network beyond ruff.
  eval-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Python
        # Same sudo rule as fuzz-smoke: the self-hosted image runs as root.
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends python3 python3-venv
          python3 -m venv /tmp/eval-venv
          /tmp/eval-venv/bin/pip install --quiet 'ruff==0.17.1'
      - name: eval/corpus tests
        run: python3 eval/corpus/tests/run_tests.py
      - name: eval/s3 tests
        run: python3 eval/s3/tests/run_tests.py
      - name: eval/scorecard tests
        run: python3 eval/scorecard/tests/run_tests.py
      - name: ruff over eval/
        run: /tmp/eval-venv/bin/ruff check eval/
      - name: eval-corpus.sh dry run
        run: scripts/test/eval-corpus-test.sh

# Intel overlay: gRParse on ONNX Runtime's OpenVINO execution provider, for
# hosts with an Intel Arc GPU (Battlemage, Alchemist) or integrated
# graphics.
#
#   docker compose -f compose.stack.yaml -f compose.stack.openvino.yaml up
#
# What it changes, and why:
#   - swaps gRParse to the Intel image (pipestreamai/grparse:latest-openvino,
#     built from Dockerfile.openvino), which carries no CUDA toolchain,
#   - drops `gpus: all` and passes the render device instead, which is how
#     OpenVINO reaches the GPU,
#   - sets GRPARSE_ORT_EP=openvino and names the OpenVINO device (GPU by
#     default; CPU or NPU are the other values the plugin accepts), with a
#     compiled-kernel cache so a later boot does not recompile.
#   - stores that cache in a named volume, not on the 256 MB /tmp tmpfs: the
#     GPU plugin compiles a kernel set per input size, OCR crops and turned
#     rasters add new sizes all the time, and a full tmpfs means truncated
#     blobs that the next load cannot open (clCreateProgramWithBinary, exit
#     139, krick-1 2026-09-01 after a handful of documents).
services:
  grparse:
    image: pipestreamai/grparse:latest-openvino
    build:
      context: .
      dockerfile: Dockerfile.openvino
    gpus: !reset null
    devices:
      - /dev/dri:/dev/dri
    environment:
      GRPARSE_ORT_EP: openvino
      GRPARSE_OPENVINO_DEVICE: GPU
      GRPARSE_OPENVINO_CACHE_DIR: /var/cache/openvino
    volumes:
      - ./models:/models:ro
      - openvino-cache:/var/cache/openvino

volumes:
  openvino-cache:

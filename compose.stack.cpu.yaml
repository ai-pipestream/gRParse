# CPU overlay for hosts without an NVIDIA GPU: macOS (Apple Silicon or
# Intel) and plain Linux boxes alike.
#
#   docker compose -f compose.stack.yaml -f compose.stack.cpu.yaml up
#
# What it changes, and why:
#   - swaps gRParse to the multi-arch CPU image (pipestreamai/grparse:
#     latest-cpu, built from Dockerfile.cpu), which links ONNX Runtime's
#     plain CPU package and runs natively on amd64 and arm64 - no
#     emulation anywhere in the stack,
#   - drops `gpus: all` (Docker Desktop on macOS has no NVIDIA runtime and
#     errors out on the reservation),
#   - sets GRPARSE_ORT_EP=cpu, matching the image's own default, so the
#     provider choice is explicit in the compose config too.
#
# OCR and layout inference run slower on CPU, but the whole demo works.
# The asr service in the `heavy` profile already uses the CPU whisper
# image in the base file.
services:
  grparse:
    image: pipestreamai/grparse:latest-cpu
    build:
      context: .
      dockerfile: Dockerfile.cpu
    gpus: !reset null
    environment:
      GRPARSE_ORT_EP: cpu

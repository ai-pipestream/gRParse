syntax = "proto3";

package ai.pipestream.parse.v1;

import "ai/pipestream/parse/v1/parse_types.proto";

option java_multiple_files = true;
option java_outer_classname = "ParseProto";
option java_package = "ai.pipestream.parse.v1";

// ============================================================================
// Service Definition
// ============================================================================

// ParseService is the gRPC service definition for document conversion. The
// RPC set maps one-to-one onto the REST endpoints noted per RPC below.
//
// Adheres to Buf linting and Google gRPC style guide by providing unique
// request and response messages for every RPC.
service ParseService {
  // Health check - mirrors GET /health
  rpc Health(HealthRequest) returns (HealthResponse);

  // Service metadata for the shared demo shell: name, version, and the UI
  // advertisement the shell reads to build its tab bar.
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);

  // Synchronous document conversion - mirrors POST /v1/convert/source
  rpc ConvertSource(ConvertSourceRequest) returns (ConvertSourceResponse);

  // Asynchronous document conversion - submits the task and returns status immediately.
  rpc ConvertSourceAsync(ConvertSourceAsyncRequest) returns (ConvertSourceAsyncResponse);

  // Synchronous hierarchical chunking - mirrors POST /v1/chunk/hierarchical/source
  rpc ChunkHierarchicalSource(ChunkHierarchicalSourceRequest) returns (ChunkHierarchicalSourceResponse);

  // Synchronous hybrid chunking - mirrors POST /v1/chunk/hybrid/source
  rpc ChunkHybridSource(ChunkHybridSourceRequest) returns (ChunkHybridSourceResponse);

  // Streamed chunking: parses the one source exactly as the two chunk RPCs
  // above do, then sends each chunk as its own message in chunk_index order
  // and closes with one summary. The parse finishes before the first chunk
  // goes out, so what streams is the result, not the parse; a consumer can
  // embed and store as it reads, and no single message has to hold the
  // whole chunk list. With include_converted_doc the summary carries the
  // whole Document, which can be as large as a unary response. No REST
  // counterpart.
  rpc StreamChunks(StreamChunksRequest) returns (stream StreamChunksResponse);

  // Async hierarchical chunking - mirrors POST /v1/chunk/hierarchical/source/async
  rpc ChunkHierarchicalSourceAsync(ChunkHierarchicalSourceAsyncRequest) returns (ChunkHierarchicalSourceAsyncResponse);

  // Async hybrid chunking - mirrors POST /v1/chunk/hybrid/source/async
  rpc ChunkHybridSourceAsync(ChunkHybridSourceAsyncRequest) returns (ChunkHybridSourceAsyncResponse);

  // Poll async task status - mirrors GET /v1/status/poll/{taskId}
  rpc PollTaskStatus(PollTaskStatusRequest) returns (PollTaskStatusResponse);

  // Get convert task result - mirrors GET /v1/result/{taskId} for convert tasks
  rpc GetConvertResult(GetConvertResultRequest) returns (GetConvertResultResponse);

  // Get chunk task result - mirrors GET /v1/result/{taskId} for chunk tasks
  rpc GetChunkResult(GetChunkResultRequest) returns (GetChunkResultResponse);

  // Clear converters - mirrors GET /v1/clear/converters
  rpc ClearConverters(ClearConvertersRequest) returns (ClearConvertersResponse);

  // Clear stale results - mirrors GET /v1/clear/results
  rpc ClearResults(ClearResultsRequest) returns (ClearResultsResponse);

  // Streaming document conversion - currently yields a single response when complete.
  // Deprecated in favor of ParseStreamingService.StreamDocument (envelope oneof).
  // Kept for existing clients; new work should use StreamDocument.
  rpc ConvertSourceStream(ConvertSourceStreamRequest) returns (stream ConvertSourceStreamResponse);

  // --- Watch RPCs (server-managed polling via streaming) ---
  // These RPCs submit the task, then internally poll and stream each status
  // update until the task completes or fails. Clients just read the stream
  // instead of managing their own poll loop.

  // Watch convert task - submit and stream status updates until done.
  rpc WatchConvertSource(WatchConvertSourceRequest) returns (stream WatchConvertSourceResponse);

  // Watch hierarchical chunk task - submit and stream status updates until done.
  rpc WatchChunkHierarchicalSource(WatchChunkHierarchicalSourceRequest) returns (stream WatchChunkHierarchicalSourceResponse);

  // Watch hybrid chunk task - submit and stream status updates until done.
  rpc WatchChunkHybridSource(WatchChunkHybridSourceRequest) returns (stream WatchChunkHybridSourceResponse);
}

// ============================================================================
// RPC Request / Response Wrappers
// ============================================================================

// --- Health ---

message HealthRequest {}

// The service's own answer to "should work be routed here". grpc.health.v1
// reports the same thing on the same port: NOT_SERVING for
// SERVING_STATE_NOT_SERVING, SERVING for the other two.
enum ServingState {
  // A server that predates this field; read `status` instead.
  SERVING_STATE_UNSPECIFIED = 0;
  // Startup has not finished: the engines the settings ask for are not all
  // built yet, so no request should be sent.
  SERVING_STATE_NOT_SERVING = 1;
  // Startup finished and no component below is in a state that costs a
  // request something the deployment was set up to deliver.
  SERVING_STATE_SERVING = 2;
  // Startup finished and requests are answered, but with a part missing. At
  // least one component is COMPONENT_STATE_NOT_LOADED (an engine its
  // setting allowed and startup did not build), COMPONENT_STATE_UNREACHABLE
  // (a configured peer whose last connection attempt failed), or is a PDF
  // backend that is COMPONENT_STATE_NOT_CONFIGURED (every PDF on the
  // in-process path then fails FAILED_PRECONDITION). `components` says
  // which. An engine switched off by its setting and a collector whose
  // target is unset are the operator's choice and do not count.
  SERVING_STATE_SERVING_DEGRADED = 3;
}

// What a component is to this process.
enum ComponentKind {
  COMPONENT_KIND_UNSPECIFIED = 0;
  // A model the process runs itself, built once at startup: OCR, layout,
  // table structure, the figure classifier, chunk embeddings.
  COMPONENT_KIND_ENGINE = 1;
  // A PdfBackendService target named by GRPARSE_PDF_BACKEND, the only way
  // this service reads a PDF. One component per target of a consensus list;
  // a single NOT_CONFIGURED one when the variable is unset.
  COMPONENT_KIND_PDF_BACKEND = 2;
  // A collector dialed at its GRPARSE_<NAME>_TARGET; `collector` says which.
  COMPONENT_KIND_COLLECTOR = 3;
  // A sister service dialed for a leg that is not a collector: the chart
  // derender leg (GRPARSE_ENRICH_TARGET) and the LightOnOCR leg
  // (GRPARSE_LIGHTON_TARGET).
  COMPONENT_KIND_PEER = 4;
}

// The state of one component. The first three are an engine's, the rest a
// dialed target's.
enum ComponentState {
  COMPONENT_STATE_UNSPECIFIED = 0;
  // Engine: built at startup and in use.
  COMPONENT_STATE_LOADED = 1;
  // Engine: switched off by its setting. The work it does is not done, by
  // the operator's choice.
  COMPONENT_STATE_DISABLED = 2;
  // Engine: its setting allowed it and startup did not build it (its model
  // file or the engine it depends on was absent). The work it does is not
  // done, and nothing but this field and the startup log says so.
  COMPONENT_STATE_NOT_LOADED = 3;
  // Target: its variable is unset. A request that needs it fails.
  COMPONENT_STATE_NOT_CONFIGURED = 4;
  // Target: named, and no channel to it is READY or failing: either no
  // request has needed it since startup, or its connections are idle or
  // still connecting. Says nothing about whether the peer is up.
  COMPONENT_STATE_CONFIGURED = 5;
  // Target: named, and at least one channel to it is READY.
  COMPONENT_STATE_CONNECTED = 6;
  // Target: named, no channel to it is READY and at least one is in
  // TRANSIENT_FAILURE: the last connection attempt failed and gRPC is
  // backing off. A request that needs it is failing now.
  COMPONENT_STATE_UNREACHABLE = 7;
}

// grpc_connectivity_state, as gRPC reports it for one client channel.
enum ChannelConnectivity {
  CHANNEL_CONNECTIVITY_UNSPECIFIED = 0;
  CHANNEL_CONNECTIVITY_IDLE = 1;
  CHANNEL_CONNECTIVITY_CONNECTING = 2;
  CHANNEL_CONNECTIVITY_READY = 3;
  CHANNEL_CONNECTIVITY_TRANSIENT_FAILURE = 4;
  CHANNEL_CONNECTIVITY_SHUTDOWN = 5;
}

// One thing a request may depend on, and what this process knows about it.
// Nothing here is probed for the answer: an engine's state was settled at
// startup, and a target's is read from the channels requests already use.
message ComponentHealth {
  // A stable short name: "ocr", "layout", "table-structure",
  // "figure-classifier", "embeddings", "pdf-backend", "enrich",
  // "lighton-ocr", or the collector's name as the startup log prints it
  // ("libreoffice", "lol-html", "vlm-convert", ...).
  string name = 1;
  ComponentKind kind = 2;
  ComponentState state = 3;
  // Set for COMPONENT_KIND_COLLECTOR only.
  optional Collector collector = 4;
  // The dial target as configured; set when the component is a target that
  // is named.
  optional string target = 5;
  // One entry per channel this process holds to the target, in pool order.
  // Empty until a request first needs the target: channels are created on
  // first use, and Health neither creates nor connects one.
  repeated ChannelConnectivity channels = 6;
}

message HealthResponse {
  // The text form of `state`, kept for clients that read it: "starting"
  // (NOT_SERVING), "ready" (SERVING) or "degraded" (SERVING_DEGRADED).
  optional string status = 1;
  optional string version = 2; // converter version, e.g. "1.12.0"
  ServingState state = 3;
  // Every engine, PDF backend, collector and peer this build knows, each
  // exactly once, whether or not it is in use.
  repeated ComponentHealth components = 4;
}

// --- Service info ---

// Frontend advertisement. Same shape in every ai-pipestream grpc service:
// the demo shell reads it to build its tab bar.
message UiInfo {
  string title = 1;        // tab title, e.g. "EPUB"
  string path = 2;         // shell mount path, e.g. "/ui/epub"
  string description = 3;  // one line, used as the tab tooltip
}

message GetServiceInfoRequest {}

message GetServiceInfoResponse {
  string name = 1;     // repo name, e.g. "gRParse"
  string version = 2;  // build version
  UiInfo ui = 3;
  EmbeddingCapabilities embeddings = 4;
}

// --- Convert ---

message ConvertSourceRequest {
  ConvertDocumentRequest request = 1;
}

message ConvertSourceResponse {
  ConvertDocumentResponse response = 1;
}

message ConvertSourceAsyncRequest {
  ConvertDocumentRequest request = 1;
}

message ConvertSourceAsyncResponse {
  TaskStatusPollResponse response = 1;
}

message ConvertSourceStreamRequest {
  ConvertDocumentRequest request = 1;
}

message ConvertSourceStreamResponse {
  ConvertDocumentResponse response = 1;
}

// --- Chunk ---

message ChunkHierarchicalSourceRequest {
  HierarchicalChunkRequest request = 1;
}

message ChunkHierarchicalSourceResponse {
  ChunkDocumentResponse response = 1;
}

message ChunkHybridSourceRequest {
  HybridChunkRequest request = 1;
}

message ChunkHybridSourceResponse {
  ChunkDocumentResponse response = 1;
}

// Exactly one chunker must be set; neither answers INVALID_ARGUMENT. Each
// carries the same fields, validation and target refusal as its unary RPC.
message StreamChunksRequest {
  oneof chunker {
    HierarchicalChunkRequest hierarchical = 1;
    HybridChunkRequest hybrid = 2;
  }
}

// Every chunk message comes first, then exactly one summary, then the stream
// closes OK. A failure before the first chunk (bad options, a failed parse,
// a failed embedding batch) closes the stream with that status and sends no
// messages, so a reader never sees a partial chunk list end in OK.
message StreamChunksResponse {
  oneof event {
    Chunk chunk = 1;
    StreamChunksSummary summary = 2;
  }
}

// The ChunkDocumentResponse fields that sit beside the chunks.
message StreamChunksSummary {
  // How many chunk messages preceded this summary.
  int32 chunk_count = 1;
  // As ChunkDocumentResponse.documents: the converted document when the
  // request set include_converted_doc, otherwise an entry only when some
  // collector failed.
  repeated Document documents = 2;
  double processing_time = 3;
  // Was `map<string, ScalarValue> chunking_info`; read `chunker_settings`.
  reserved 4;
  reserved "chunking_info";
  // As ChunkDocumentResponse.chunk_omissions, for the chunk messages that
  // preceded this summary.
  optional RenderOmissions chunk_omissions = 5;
  // As ChunkDocumentResponse.option_notices.
  repeated OptionNotice option_notices = 6;
  // As ChunkDocumentResponse.chunker_settings.
  optional ChunkerSettings chunker_settings = 7;
}

message ChunkHierarchicalSourceAsyncRequest {
  HierarchicalChunkRequest request = 1;
}

message ChunkHierarchicalSourceAsyncResponse {
  TaskStatusPollResponse response = 1;
}

message ChunkHybridSourceAsyncRequest {
  HybridChunkRequest request = 1;
}

message ChunkHybridSourceAsyncResponse {
  TaskStatusPollResponse response = 1;
}

// --- Task ---

message PollTaskStatusRequest {
  TaskStatusPollRequest request = 1;
}

message PollTaskStatusResponse {
  TaskStatusPollResponse response = 1;
}

message GetConvertResultRequest {
  TaskResultRequest request = 1;
}

message GetConvertResultResponse {
  ConvertDocumentResponse response = 1;
}

message GetChunkResultRequest {
  TaskResultRequest request = 1;
}

message GetChunkResultResponse {
  ChunkDocumentResponse response = 1;
}

// --- Clear ---

message ClearConvertersRequest {}

message ClearConvertersResponse {
  ClearResponse response = 1;
}

message ClearResultsRequest {
  // Clear results older than this many seconds (default: 3600)
  optional double older_than = 1;
}

message ClearResultsResponse {
  ClearResponse response = 1;
}

// --- Watch ---

message WatchConvertSourceRequest {
  ConvertDocumentRequest request = 1;
}

message WatchConvertSourceResponse {
  TaskStatusPollResponse response = 1;
}

message WatchChunkHierarchicalSourceRequest {
  HierarchicalChunkRequest request = 1;
}

message WatchChunkHierarchicalSourceResponse {
  TaskStatusPollResponse response = 1;
}

message WatchChunkHybridSourceRequest {
  HybridChunkRequest request = 1;
}

message WatchChunkHybridSourceResponse {
  TaskStatusPollResponse response = 1;
}

syntax = "proto3";

package ai.pipestream.parse.v1;

import "ai/pipestream/document/v1/document.proto";
import "google/protobuf/struct.proto";

option java_multiple_files = true;
option java_outer_classname = "ParseTypesProto";
option java_package = "ai.pipestream.parse.v1";

// ============================================================================
// Enumerations - 1:1 mapping of the REST API enum types
// ============================================================================

// Input document format types supported by the converter.
enum InputFormat {
  INPUT_FORMAT_UNSPECIFIED = 0;
  INPUT_FORMAT_ASCIIDOC = 1;
  INPUT_FORMAT_AUDIO = 2;
  INPUT_FORMAT_CSV = 3;
  INPUT_FORMAT_DOCX = 4;
  INPUT_FORMAT_HTML = 5;
  INPUT_FORMAT_IMAGE = 6;
  INPUT_FORMAT_JSON_DOCLING = 7;
  INPUT_FORMAT_MD = 8;
  INPUT_FORMAT_METS_GBS = 9;
  INPUT_FORMAT_PDF = 10;
  INPUT_FORMAT_PPTX = 11;
  INPUT_FORMAT_XLSX = 12;
  INPUT_FORMAT_XML_JATS = 13;
  INPUT_FORMAT_XML_USPTO = 14;
  INPUT_FORMAT_LATEX = 15;
  INPUT_FORMAT_VTT = 16;
  INPUT_FORMAT_XML_XBRL = 17;
}

// Output format types for converted documents.
enum OutputFormat {
  OUTPUT_FORMAT_UNSPECIFIED = 0;
  OUTPUT_FORMAT_DOCTAGS = 1;
  OUTPUT_FORMAT_HTML = 2;
  OUTPUT_FORMAT_HTML_SPLIT_PAGE = 3;
  OUTPUT_FORMAT_JSON = 4;
  OUTPUT_FORMAT_MARKDOWN = 5;
  OUTPUT_FORMAT_TEXT = 6;
  OUTPUT_FORMAT_YAML = 7;
  OUTPUT_FORMAT_VTT = 8;
  OUTPUT_FORMAT_DOCLANG = 9;
  // The upstream-canonical JSON dialect of the document (flat
  // label-discriminated items, "$ref" references, canonical enum strings),
  // as opposed to OUTPUT_FORMAT_JSON's protobuf-JSON of the wire schema.
  OUTPUT_FORMAT_CANONICAL_JSON = 10;
  // The document rendered into the body shape of the Docs API "document"
  // resource, ready for a create-then-patch integration.
  OUTPUT_FORMAT_GDOCS_JSON = 11;
}

// OCR engine selection.
enum OcrEngine {
  OCR_ENGINE_UNSPECIFIED = 0;
  OCR_ENGINE_AUTO = 1;
  OCR_ENGINE_EASYOCR = 2;
  OCR_ENGINE_OCRMAC = 3;
  OCR_ENGINE_RAPIDOCR = 4;
  OCR_ENGINE_TESSEROCR = 5;
  OCR_ENGINE_TESSERACT = 6;
}

// PDF processing backend.
enum PdfBackend {
  PDF_BACKEND_UNSPECIFIED = 0;
  PDF_BACKEND_DLPARSE_V1 = 1;
  PDF_BACKEND_DLPARSE_V2 = 2;
  PDF_BACKEND_DLPARSE_V4 = 3;
  PDF_BACKEND_PYPDFIUM2 = 4;
  PDF_BACKEND_DOCLING_PARSE = 5;
}

// Table structure extraction mode.
enum TableFormerMode {
  TABLE_FORMER_MODE_UNSPECIFIED = 0;
  TABLE_FORMER_MODE_ACCURATE = 1;
  TABLE_FORMER_MODE_FAST = 2;
}

// Document processing pipeline.
enum ProcessingPipeline {
  PROCESSING_PIPELINE_UNSPECIFIED = 0;
  PROCESSING_PIPELINE_ASR = 1;
  PROCESSING_PIPELINE_STANDARD = 2;
  PROCESSING_PIPELINE_VLM = 3;
  PROCESSING_PIPELINE_LEGACY = 4;
}

// Image reference mode for export.
enum ImageRefMode {
  IMAGE_REF_MODE_UNSPECIFIED = 0;
  IMAGE_REF_MODE_EMBEDDED = 1;
  IMAGE_REF_MODE_PLACEHOLDER = 2;
  IMAGE_REF_MODE_REFERENCED = 3;
}

// Preset VLM model types. Names mirror the upstream
// the upstream VlmModelType enum.
enum VlmModelType {
  VLM_MODEL_TYPE_UNSPECIFIED = 0;
  VLM_MODEL_TYPE_SMOLDOCLING = 1;
  VLM_MODEL_TYPE_SMOLDOCLING_VLLM = 2;
  VLM_MODEL_TYPE_GRANITE_VISION = 3;
  VLM_MODEL_TYPE_GRANITE_VISION_VLLM = 4;
  VLM_MODEL_TYPE_GRANITE_VISION_OLLAMA = 5;
  VLM_MODEL_TYPE_GOT_OCR_2 = 6;
  VLM_MODEL_TYPE_GRANITEDOCLING = 7;
  VLM_MODEL_TYPE_GRANITEDOCLING_VLLM = 8;
  VLM_MODEL_TYPE_DEEPSEEKOCR_OLLAMA = 9;
  VLM_MODEL_TYPE_NANONETS_OCR2 = 10;
  VLM_MODEL_TYPE_NANONETS_OCR2_VLLM = 11;
  VLM_MODEL_TYPE_NANONETS_OCR2_LMSTUDIO = 12;
  VLM_MODEL_TYPE_GLMOCR = 13;
  VLM_MODEL_TYPE_GLMOCR_VLLM = 14;
  VLM_MODEL_TYPE_LIGHTONOCR = 15;
  VLM_MODEL_TYPE_LIGHTONOCR_VLLM = 16;
}

// Response format for VLM model output.
enum ResponseFormat {
  RESPONSE_FORMAT_UNSPECIFIED = 0;
  RESPONSE_FORMAT_DOCTAGS = 1;
  RESPONSE_FORMAT_MARKDOWN = 2;
  RESPONSE_FORMAT_HTML = 3;
  RESPONSE_FORMAT_OTSL = 4;
  RESPONSE_FORMAT_PLAINTEXT = 5;
}

// Inference framework for local VLM models.
enum InferenceFramework {
  INFERENCE_FRAMEWORK_UNSPECIFIED = 0;
  INFERENCE_FRAMEWORK_MLX = 1;
  INFERENCE_FRAMEWORK_TRANSFORMERS = 2;
  INFERENCE_FRAMEWORK_VLLM = 3;
}

// Type of transformers auto-model to use. Names mirror the upstream
// the upstream TransformersModelType enum.
enum TransformersModelType {
  TRANSFORMERS_MODEL_TYPE_UNSPECIFIED = 0;
  TRANSFORMERS_MODEL_TYPE_AUTOMODEL = 1;
  TRANSFORMERS_MODEL_TYPE_AUTOMODEL_IMAGETEXTTOTEXT = 2;
  TRANSFORMERS_MODEL_TYPE_AUTOMODEL_CAUSALLM = 3;
}

// Async task status.
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_STARTED = 2;
  TASK_STATUS_SUCCESS = 3;
  TASK_STATUS_FAILURE = 4;
}

// Collector names one parser that can contribute output to a parse. The
// scatter-gather coordinator fans the document bytes out to every selected
// collector and merges their source-tagged output additively; sources never
// overwrite each other.
enum Collector {
  COLLECTOR_UNSPECIFIED = 0;
  // The in-process CV path: layout, OCR, table structure, and figure models
  // over rendered pages. The default for PDF and raster inputs.
  COLLECTOR_GRPARSE_CV = 1;
  // The grpc-libreoffice typed-stream collector. The default for office
  // formats; requires a configured collector endpoint.
  COLLECTOR_LIBREOFFICE = 2;
  // The poi-parse text, metadata, and native-table collector. Reserved
  // until the collector is wired in.
  COLLECTOR_POI = 3;
  // The calamine spreadsheet collector. Reserved until the collector is
  // wired in.
  COLLECTOR_CALAMINE = 4;
  // The grpc-asr transcription collector. The default for audio and video
  // inputs; requires a configured endpoint and a configured model name.
  COLLECTOR_ASR = 5;
  // The grpc-email collector. The default for .eml/.msg inputs; requires a
  // configured endpoint.
  COLLECTOR_EMAIL = 6;
  // The grpc-xml dialect collector. The default for XML inputs; requires a
  // configured endpoint. The dialect is sniffed by the collector itself.
  COLLECTOR_XML = 7;
  // The grpc-ebcdic collector. Never routed by format: raw EBCDIC has no
  // extension or magic worth trusting, and a parse needs a layout. Select
  // it explicitly and supply ebcdic_layout_json.
  COLLECTOR_EBCDIC = 8;
  // The grpc-epub collector. The default for .epub inputs; requires a
  // configured endpoint.
  COLLECTOR_EPUB = 9;
  // The grpc-markup collector: Markdown, HTML, AsciiDoc, LaTeX, WebVTT,
  // BoxNote and serialized Docling JSON. The default for those inputs;
  // requires a configured endpoint. The format is hinted from the filename
  // and content type; the collector sniffs when no hint resolves.
  COLLECTOR_MARKUP = 10;
  // The grpc-lol-html selector-extraction collector. Never routed by
  // format: it reports what its CSS selector rules match and nothing else,
  // so a parse needs rules. Select it explicitly and supply
  // lol_html_options_json; HTML with no selection routes to
  // COLLECTOR_MARKUP for whole-document conversion instead.
  COLLECTOR_LOL_HTML = 11;
  // The fastwarc-grpc WARC archive collector. The default for .warc and its
  // compressed forms (.warc.gz, .warc.zst, .warc.lz4); requires a configured
  // endpoint. The collector's record stream is folded into a Document
  // client-side, one group per archive record.
  COLLECTOR_FASTWARC = 12;
  // The grpc-pdf-inspector collector: the PDF routing oracle. The default
  // for PDF inputs when an endpoint is configured (the in-process CV path
  // stays the default otherwise). Its classification drives the parse: a
  // text-based document comes back as the collector's own Document with the
  // CV pipeline skipped entirely; a scanned, image-based, or mixed document
  // falls through to the CV path with recognition restricted to the pages
  // the inspector named as needing OCR. When it shares an explicit
  // selection with other collectors it is a plain Document-emitting
  // collector instead, like the others.
  COLLECTOR_PDF = 13;
  // The in-process wiki storage handler: XHTML with the macro layer of the
  // ac: and ri: namespaces, parsed here rather than dialed. The default for
  // the storage content type and for the .confluence / .storage.xhtml
  // suffixes; plain XHTML with no macro layer stays with COLLECTOR_MARKUP.
  COLLECTOR_CONFLUENCE = 14;
}

// ============================================================================
// Source Types - where documents come from
// ============================================================================

// Source represents a document input source (polymorphic via oneof).
message Source {
  oneof source {
    FileSource file = 1;
    HttpSource http = 2;
    S3Source s3 = 3;
  }
}

// FileSource provides a document as base64-encoded content.
message FileSource {
  // Base64-encoded file content
  string base64_string = 1;
  // Original filename
  string filename = 2;
}

// HttpSource provides a document via HTTP URL.
message HttpSource {
  // URL to fetch the document from
  string url = 1;
  // Optional HTTP headers (e.g., authentication)
  map<string, string> headers = 2;
}

// S3Source provides a document from an S3-compatible store.
message S3Source {
  string endpoint = 1;
  string access_key = 2;
  string secret_key = 3;
  string bucket = 4;
  optional string key_prefix = 5;
  bool verify_ssl = 6;
}

// ============================================================================
// Target Types - where results go
// ============================================================================

// Target represents a result destination (polymorphic via oneof).
message Target {
  oneof target {
    InBodyTarget inbody = 1;
    PutTarget put = 2;
    S3Target s3 = 3;
    ZipTarget zip = 4;
    PreSignedUrlTarget presigned_url = 5;
  }
}

// InBodyTarget returns results in the response body (default).
message InBodyTarget {}

// PutTarget sends results via HTTP PUT. Declared for wire compatibility;
// this server answers it UNIMPLEMENTED.
message PutTarget {
  string url = 1;
}

// S3Target sends results to an S3-compatible store.
message S3Target {
  string endpoint = 1;
  string access_key = 2;
  string secret_key = 3;
  string bucket = 4;
  optional string key_prefix = 5;
  // TLS peer and hostname verification. UNSET MEANS VERIFY: a plain bool
  // here would default to false and silently ship credentials and content
  // with verification off; presence-tracked, only an explicit false
  // disables it (for self-signed internal stores).
  optional bool verify_ssl = 6;
}

// ZipTarget returns results as a ZIP archive.
message ZipTarget {}

// PreSignedUrlTarget stores results in the configured artifact storage and
// returns pre-signed download URLs. Requires artifact storage to be enabled
// on the server; not supported for chunk endpoints. Declared for wire
// compatibility; this server answers it UNIMPLEMENTED.
message PreSignedUrlTarget {}

// StoredObject names one object a target wrote to an object store.
message StoredObject {
  // Object key, including the request's key_prefix.
  string key = 1;
  // The store's entity tag for the written object, verbatim and with its
  // quoting as the store returned it. Empty when the store returned none.
  string etag = 2;
  uint64 size_bytes = 3;
}

// TargetResult carries what a non-inbody Target produced. Targets are an
// additive delivery of the same conversion, never a replacement: a response
// that carries a TargetResult still carries its DocumentResponse in full.
message TargetResult {
  // The ZIP archive of the result bundle, set only by ZipTarget.
  optional bytes archive = 1;
  // The objects written, in the bundle's own sorted path order. Set only by
  // the store-writing targets.
  repeated StoredObject objects = 2;
}

// ============================================================================
// Convert Options
// ============================================================================

// PictureDescriptionLocal configures a local VLM for picture descriptions.
message PictureDescriptionLocal {
  // Hugging Face repository ID
  string repo_id = 1;
  // Optional prompt for the model
  optional string prompt = 2;
  // Optional generation config parameters
  map<string, google.protobuf.Value> generation_config = 3;
}

// PictureDescriptionApi configures an API-based VLM for picture descriptions.
message PictureDescriptionApi {
  // API endpoint URL
  string url = 1;
  // Optional HTTP headers
  map<string, string> headers = 2;
  // Optional model parameters
  map<string, google.protobuf.Value> params = 3;
  // Timeout in seconds
  optional double timeout = 4;
  // Max concurrent requests
  optional int32 concurrency = 5;
  // Optional prompt
  optional string prompt = 6;
}

// VlmModelLocal configures a local vision-language model for the VLM pipeline.
message VlmModelLocal {
  optional string repo_id = 1;
  optional string prompt = 2;
  optional int32 scale = 3;
  optional ResponseFormat response_format = 4;
  optional InferenceFramework inference_framework = 5;
  optional TransformersModelType transformers_model_type = 6;
  map<string, google.protobuf.Value> extra_generation_config = 7;
}

// VlmModelApi configures an API-based vision-language model for the VLM pipeline.
message VlmModelApi {
  optional string url = 1;
  map<string, string> headers = 2;
  map<string, google.protobuf.Value> params = 3;
  optional double timeout = 4;
  optional int32 concurrency = 5;
  optional string prompt = 6;
  optional int32 scale = 7;
  optional ResponseFormat response_format = 8;
}

// ConvertDocumentOptions mirrors all conversion settings from the REST API.
message ConvertDocumentOptions {
  // Input format(s) to convert from
  repeated InputFormat from_formats = 1;
  // Output format(s) to convert to
  repeated OutputFormat to_formats = 2;
  // Image export mode
  optional ImageRefMode image_export_mode = 3;
  // Text recognition over rendered pages. Unset or true runs selective
  // recognition: a page whose embedded text layer is complete skips it,
  // every other page is recognized and merged with the embedded text it
  // has. False disables recognition entirely, so only the embedded text
  // layer is read and a page with no text layer yields no text. False
  // combined with force_ocr true is contradictory and rejected.
  optional bool do_ocr = 4;
  // Recognize every page at full-page scope and let the recognized text
  // replace the embedded text layer. Unset or false keeps the selective
  // default. True combined with do_ocr false is contradictory and rejected.
  optional bool force_ocr = 5;
  // OCR engine selection
  optional OcrEngine ocr_engine = 6;
  // OCR language codes
  repeated string ocr_lang = 7;
  // PDF processing backend
  optional PdfBackend pdf_backend = 8;
  // Table structure mode
  optional TableFormerMode table_mode = 9;
  // Match table cells to PDF cells
  optional bool table_cell_matching = 10;
  // Processing pipeline
  optional ProcessingPipeline pipeline = 11;
  // Page range to process (1-indexed)
  repeated int32 page_range = 12;
  // Per-document timeout in seconds
  optional double document_timeout = 13;
  // Abort on first error
  optional bool abort_on_error = 14;
  // Extract table structure
  optional bool do_table_structure = 15;
  // Extract images
  optional bool include_images = 16;
  // Image scale factor
  optional double images_scale = 17;
  // Markdown page break placeholder
  optional string md_page_break_placeholder = 18;
  // Enable code OCR enrichment
  optional bool do_code_enrichment = 19;
  // Enable formula OCR enrichment
  optional bool do_formula_enrichment = 20;
  // Enable picture classification
  optional bool do_picture_classification = 21;
  // Enable picture description
  optional bool do_picture_description = 22;
  // Min area percentage for picture processing
  optional double picture_description_area_threshold = 23;
  // Local VLM for picture description (mutually exclusive with api)
  optional PictureDescriptionLocal picture_description_local = 24;
  // API VLM for picture description (mutually exclusive with local)
  optional PictureDescriptionApi picture_description_api = 25;
  // Preset VLM model (mutually exclusive with local/api)
  optional VlmModelType vlm_pipeline_model = 26;
  // Local VLM model string (mutually exclusive with api/preset)
  optional string vlm_pipeline_model_local = 27;
  // API VLM model string (mutually exclusive with local/preset)
  optional string vlm_pipeline_model_api = 28;
  // Enable chart extraction
  optional bool do_chart_extraction = 29;
  // Preset for VLM pipeline configuration
  optional string vlm_pipeline_preset = 30;
  // Preset for picture description configuration
  optional string picture_description_preset = 31;
  // Preset for code/formula enrichment configuration
  optional string code_formula_preset = 32;
  // Custom VLM pipeline configuration
  optional google.protobuf.Struct vlm_pipeline_custom_config = 33;
  // Custom picture description configuration
  optional google.protobuf.Struct picture_description_custom_config = 34;
  // Custom code/formula enrichment configuration
  optional google.protobuf.Struct code_formula_custom_config = 35;
  // Custom table structure extraction configuration
  optional google.protobuf.Struct table_structure_custom_config = 36;
  // Custom layout configuration
  optional google.protobuf.Struct layout_custom_config = 37;
  // Preset for OCR configuration
  optional string ocr_preset = 38;
  // Custom OCR configuration
  optional google.protobuf.Struct ocr_custom_config = 39;
  // Preset for table structure extraction configuration
  optional string table_structure_preset = 40;
  // Preset for layout configuration
  optional string layout_preset = 41;
  // Preset for picture classification configuration
  optional string picture_classification_preset = 42;
  // Custom picture classification configuration
  optional google.protobuf.Struct picture_classification_custom_config = 43;
  // The collectors to run for this parse. Empty routes by format: office
  // formats to COLLECTOR_LIBREOFFICE, WARC archives to COLLECTOR_FASTWARC,
  // audio and video to COLLECTOR_ASR,
  // .eml/.msg to COLLECTOR_EMAIL, XML to COLLECTOR_XML, .epub to
  // COLLECTOR_EPUB, and PDF and raster inputs to COLLECTOR_GRPARSE_CV —
  // except that a configured COLLECTOR_PDF endpoint makes the pdf
  // inspector the default PDF route, its classification deciding between
  // the collector's own fast-path Document and an OCR-restricted CV run.
  // Every selected collector's output is merged additively, source-tagged;
  // a failed collector degrades to an error entry instead of failing the
  // parse while any collector succeeds.
  repeated Collector collectors = 44;
  // Parsing rules for COLLECTOR_EBCDIC, as the JSON serialization of
  // that collector's EbcdicLayout model, forwarded verbatim to the
  // collector's ParseOptions.layout_json. Required when COLLECTOR_EBCDIC is
  // selected: that collector cannot decode a byte without a layout, and
  // raw EBCDIC is never routed by format.
  optional bytes ebcdic_layout_json = 45;
  // Extraction rules for COLLECTOR_LOL_HTML, as the protobuf JSON
  // serialization of that collector's lolhtml.v1.ExtractOptions message
  // (rules, document_rule, encoding, limits, and so on). Required when
  // COLLECTOR_LOL_HTML is selected: that collector extracts what its CSS
  // selector rules name, and this client never invents rules.
  optional bytes lol_html_options_json = 46;
  // The CV path's rasterization scale, in multiples of 72 DPI (1.0 renders
  // pages at 72 DPI). Unset keeps the server default of 200 DPI (about
  // 2.78). The accepted range is [1.0, 8.0]; values outside it are rejected
  // by name. Raster image inputs are already pixels and ignore it.
  optional double render_scale = 47;
}

// ============================================================================
// Error types
// ============================================================================

// ConversionStatus mirrors the upstream ConversionStatus enum.
enum ConversionStatus {
  CONVERSION_STATUS_UNSPECIFIED = 0;
  CONVERSION_STATUS_PENDING = 1;
  CONVERSION_STATUS_STARTED = 2;
  CONVERSION_STATUS_FAILURE = 3;
  CONVERSION_STATUS_SUCCESS = 4;
  CONVERSION_STATUS_PARTIAL_SUCCESS = 5;
  CONVERSION_STATUS_SKIPPED = 6;
}

// ComponentType mirrors the upstream ComponentType enum.
enum ComponentType {
  COMPONENT_TYPE_UNSPECIFIED = 0;
  COMPONENT_TYPE_DOCUMENT_BACKEND = 1;
  COMPONENT_TYPE_MODEL = 2;
  COMPONENT_TYPE_DOC_ASSEMBLER = 3;
  COMPONENT_TYPE_USER_INPUT = 4;
  COMPONENT_TYPE_PIPELINE = 5;
}

// ErrorItem represents a processing error from a specific component.
message ErrorItem {
  ComponentType component_type = 1;
  string error_message = 2;
  string module_name = 3;
  // Raw component type fallback for forward-compatibility with newer
  // upstream component vocabularies (populated when component_type is
  // COMPONENT_TYPE_UNSPECIFIED but the source had a value).
  optional string component_type_raw = 4;
}

// ============================================================================
// Document response types
// ============================================================================

// DocumentExports contains optional serialized output formats.
message DocumentExports {
  // Canonical JSON form of the document (same serialization as upstream REST).
  optional string json = 1;
  optional string md = 2;
  optional string html = 3;
  optional string text = 4;
  optional string doctags = 5;
  // DocLang XML form (the dialect grpc-xml reads back).
  optional string doclang = 6;
  // WebVTT cues from track-timed text items.
  optional string vtt = 7;
  // Per-page HTML (split-page layout).
  optional string html_split_page = 8;
  // YAML rendering of the same structure as `json`.
  optional string yaml = 9;
  // The upstream-canonical JSON dialect (see OUTPUT_FORMAT_CANONICAL_JSON).
  optional string canonical_json = 10;
  // The Docs API body shape (see OUTPUT_FORMAT_GDOCS_JSON).
  optional string gdocs_json = 11;
}

// DocumentResponse contains the converted document and optional exports.
message DocumentResponse {
  // Filename of the source document
  string filename = 1;
  // Native protobuf Document (always present)
  ai.pipestream.document.v1.Document doc = 2;
  // Optional serialized outputs (markdown/html/text/doctags/json)
  optional DocumentExports exports = 3;
}

// ExportDocumentResponse is the document format used within chunk responses.
message ExportDocumentResponse {
  string filename = 1;
  ai.pipestream.document.v1.Document doc = 2;
  optional DocumentExports exports = 3;
}

// Document wraps an exported document with status and error info.
message Document {
  optional string kind = 1;
  ExportDocumentResponse content = 2;
  ConversionStatus status = 3;
  repeated ErrorItem errors = 4;
  // Raw status fallback for forward-compatibility with newer upstream
  // conversion status vocabularies.
  optional string status_raw = 5;
}

// ============================================================================
// Task types
// ============================================================================

// TaskStatusMetadata provides progress information for async tasks.
message TaskStatusMetadata {
  int64 num_docs = 1;
  int64 num_processed = 2;
  int64 num_succeeded = 3;
  int64 num_failed = 4;
}

// ============================================================================
// Request / Response Domain Models (moved from the service proto)
// ============================================================================

// ConvertDocumentRequest mirrors POST /v1/convert/source
message ConvertDocumentRequest {
  repeated Source sources = 1;
  ConvertDocumentOptions options = 2;
  optional Target target = 3;
}

// ConvertDocumentResponse mirrors the REST convert response body.
message ConvertDocumentResponse {
  DocumentResponse document = 1;
  repeated ErrorItem errors = 2;
  double processing_time = 3;
  ConversionStatus status = 4;
  map<string, double> timings = 5;
  // Raw status fallback for forward-compatibility with newer upstream
  // conversion status vocabularies.
  optional string status_raw = 6;
  // What the request's Target delivered, when it named one other than
  // inbody. `document` above stays populated either way.
  optional TargetResult target_result = 7;
}

// HierarchicalChunkerOptions configures the hierarchical chunker.
message HierarchicalChunkerOptions {
  bool use_markdown_tables = 1;
  bool include_raw_text = 2;
}

// HybridChunkerOptions configures the hybrid chunker.
message HybridChunkerOptions {
  bool use_markdown_tables = 1;
  bool include_raw_text = 2;
  optional int32 max_tokens = 3;
  optional string tokenizer = 4;
  optional bool merge_peers = 5;
}

// HierarchicalChunkRequest mirrors POST /v1/chunk/hierarchical/source
message HierarchicalChunkRequest {
  repeated Source sources = 1;
  ConvertDocumentOptions convert_options = 2;
  optional Target target = 3;
  bool include_converted_doc = 4;
  HierarchicalChunkerOptions chunking_options = 5;
}

// HybridChunkRequest mirrors POST /v1/chunk/hybrid/source
message HybridChunkRequest {
  repeated Source sources = 1;
  ConvertDocumentOptions convert_options = 2;
  optional Target target = 3;
  bool include_converted_doc = 4;
  HybridChunkerOptions chunking_options = 5;
}

// Chunk represents a single document chunk in the response.
message Chunk {
  string filename = 1;
  int32 chunk_index = 2;
  string text = 3;
  // Reserved for a richer serialization of the same chunk. It currently
  // repeats `text` verbatim and is populated only when the request sets
  // include_raw_text.
  optional string raw_text = 4;
  // Token count of the chunk's contextualized text (the headings joined with
  // "\n", then "\n", then the text) under the chunker's own tokenizer. Always
  // populated by both chunkers.
  optional int32 num_tokens = 5;
  repeated string headings = 6;
  repeated string captions = 7;
  repeated string doc_items = 8;
  repeated int32 page_numbers = 9;
  map<string, string> metadata = 10;
  // Half-open [start_offset, end_offset) span of the chunk in the document's
  // concatenated text stream (furniture included), counted in UTF-8 CODE
  // POINTS, not bytes.
  // Both are set together or neither is: a chunk whose items the parse gave
  // no offset table entry for carries neither field rather than a guess.
  optional int64 start_offset = 11;
  optional int64 end_offset = 12;
  // The exact boundary-rule version this chunk was produced under. Identical
  // input bytes and an identical digest guarantee identical chunk bytes.
  //
  //   hierarchical: "grparse-hier/1"
  //   hybrid:       "grparse-hybrid/1;tok=wordish/1;sent=sentence/1;
  //                  max_tokens=N;merge_peers=B"
  //                 (one line on the wire, N decimal, B "true" or "false")
  string rules_digest = 13;
}

// ChunkDocumentResponse mirrors the REST chunk response body.
message ChunkDocumentResponse {
  repeated Chunk chunks = 1;
  repeated Document documents = 2;
  double processing_time = 3;
}

// TaskStatusPollRequest mirrors GET /v1/status/poll/{taskId}
message TaskStatusPollRequest {
  string task_id = 1;
  // Wait time in seconds (0 = no wait / immediate poll)
  double wait_time = 2;
}

// TaskStatusPollResponse mirrors the REST task status response.
message TaskStatusPollResponse {
  string task_id = 1;
  optional string task_type = 2;
  TaskStatus task_status = 3;
  optional int64 task_position = 4;
  optional TaskStatusMetadata task_meta = 5;
}

// TaskResultRequest mirrors GET /v1/result/{taskId}
message TaskResultRequest {
  string task_id = 1;
}

// ClearResponse mirrors the REST clear response body.
message ClearResponse {
  optional string status = 1;
}
